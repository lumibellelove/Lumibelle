<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHEER GUIDE 제보하기 | Lumibelle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SUIT:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#fff8fb;
      --panel:#fffafc;
      --line:#f2cfe0;
      --pink:#ff78b2;
      --pink-deep:#ff59a5;
      --text:#8a6b7c;
      --text-strong:#73586a;
      --muted:#bf93aa;
      --white:#fff;
      --shadow:0 16px 34px rgba(255,120,178,.11);
      --soft-shadow:0 8px 22px rgba(232,191,211,.13);
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      background:
        radial-gradient(circle at 0% 0%, rgba(255,230,241,.92), transparent 20%),
        radial-gradient(circle at 100% 0%, rgba(244,235,255,.74), transparent 26%),
        linear-gradient(180deg,#fffafd 0%,#fff7fb 100%);
      color:var(--text);
      font-family:"SUIT","Noto Sans KR",sans-serif;
      letter-spacing:-.012em;
      font-weight:700;
      padding:26px 14px;
    }

    button,input,textarea,select{font:inherit}
    button{cursor:pointer}

    .mock-wrap{
      width:min(860px,100%);
      margin:0 auto;
    }

    .mock-card{
      border:1px solid var(--line);
      border-radius:30px;
      background:linear-gradient(180deg,rgba(255,250,252,.97),rgba(255,247,251,.96));
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .mock-head{
      padding:30px 34px 26px;
      border-bottom:1px solid rgba(241,212,227,.82);
      background:linear-gradient(180deg,#fff7fb,#fff2f8);
      text-align:left;
    }

    .kicker{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:34px;
      padding:8px 14px;
      border:1px solid rgba(255,89,165,.12);
      border-radius:999px;
      background:rgba(255,89,165,.08);
      color:var(--pink-deep);
      font-size:12px;
      font-weight:900;
      letter-spacing:.12em;
      margin-bottom:14px;
    }

    h1{
      margin:0;
      color:var(--pink-deep);
      font-size:clamp(32px,6vw,50px);
      line-height:1;
      letter-spacing:-.055em;
      font-weight:900;
    }

    .head-desc{
      max-width:720px;
      margin:22px 0 0;
      color:#9b768b;
      font-size:15px;
      line-height:1.85;
      font-weight:780;
    }

    .form-body{
      padding:26px 30px 30px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:15px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .field.full{grid-column:1/-1}

    label{
      color:#d27ca8;
      font-size:17px;
      font-weight:900;
    }

    .required{
      color:var(--pink-deep);
      margin-left:3px;
    }

    .input,.select,.textarea{
      width:100%;
      border:1px solid #efb8d0;
      border-radius:16px;
      background:#fff;
      color:#735b69;
      font-size:14px;
      font-weight:650;
      line-height:1.55;
      padding:12px 14px;
      outline:none;
      box-shadow:0 6px 14px rgba(255,120,178,.04);
    }

    .textarea{min-height:112px;resize:vertical}

    .help{
      color:#b08a9f;
      font-size:15px;
      line-height:1.6;
      font-weight:750;
    }

    .help + .textarea{
      margin-top:5px;
    }

    .section-label{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:3px;
    }

    .section-label small{
      color:#b08a9f;
      font-size:15px;
      font-weight:850;
    }

    .line-editor-list{
      display:grid;
      gap:12px;
      margin-top:2px;
    }

    .line-editor{
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff8fc;
      overflow:hidden;
    }

    .line-editor[open]{
      background:linear-gradient(180deg,#fff,#fff8fc);
    }

    .line-editor-summary{
      list-style:none;
      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:10px 12px;
      align-items:center;
      padding:14px 16px;
      cursor:pointer;
      color:#8a6b7c;
    }

    .line-editor-summary::-webkit-details-marker{display:none}

    .line-num{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:34px;
      height:34px;
      border-radius:999px;
      border:1px solid #efb8d0;
      background:#fff;
      color:#d26f9e;
      font-size:12px;
      font-weight:900;
    }

    .line-title-wrap{min-width:0}

    .line-title{
      display:block;
      color:#77586b;
      font-size:15px;
      font-weight:900;
      line-height:1.35;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .line-preview{
      display:block;
      margin-top:3px;
      color:#ad879d;
      font-size:13px;
      font-weight:800;
      line-height:1.45;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .line-actions{
      display:flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
    }

    .line-edit-hint,
    .line-move-btn,
    .line-delete-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:34px;
      padding:0 13px;
      border-radius:999px;
      border:1px solid #efb8d0;
      background:#fff;
      color:#d26f9e;
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }

    .line-delete-btn{
      color:#c8789a;
      background:#fffafc;
    }

    .line-move-btn:disabled{
      opacity:.45;
      cursor:default;
      pointer-events:none;
    }

    .line-editor-body{
      padding:0 16px 16px;
      border-top:1px dashed rgba(239,184,208,.7);
    }

    .line-editor-body .form-grid{
      padding-top:14px;
    }

    .line-editor-body .field label{
      font-size:17px;
      font-weight:900;
    }

    .line-editor-body .input,
    .line-editor-body .textarea{
      font-size:15px;
    }

    .line-editor-body .textarea{
      min-height:96px;
    }

    .line-editor-body .guide-lyric-field,
    .line-editor-body .guide-desc-field,
    .line-editor-body .guide-tag-field,
    .line-editor-body .guide-call-field{
      grid-column:1/-1;
    }

    .line-editor-body .guide-lyric-field .textarea{
      min-height:72px;
    }

    .line-editor-body .guide-desc-field .textarea,
    .line-editor-body .guide-call-field .textarea{
      min-height:88px;
    }

    .add-line-btn{
      width:max-content;
      min-height:40px;
      margin-top:12px;
      margin-bottom:10px;
      padding:0 16px;
      border:1px solid #efb8d0;
      border-radius:999px;
      background:#fff;
      color:#d26f9e;
      font-size:13px;
      font-weight:900;
    }



    /* 현재 등록된 가이드: 가사/등록 CHEER GUIDE 분리 접힘 구조 */
    .existing-guide-card{
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(255,255,255,.62);
      overflow:hidden;
      margin-bottom:12px;
    }

    .existing-guide-head{
      display:grid;
      grid-template-columns:minmax(120px,1fr) auto auto auto;
      align-items:center;
      gap:10px;
      padding:14px 16px;
      border-bottom:1px dashed rgba(239,184,208,.72);
      background:#fff8fc;
    }

    .existing-guide-title{
      color:#77586b;
      font-size:15px;
      font-weight:900;
      line-height:1.35;
      min-width:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .existing-guide-toggle{
      min-height:32px;
      padding:0 12px;
      border:1px solid transparent;
      border-radius:999px;
      background:transparent;
      color:#d26f9e;
      font-size:13px;
      font-weight:900;
      white-space:nowrap;
    }

    .existing-guide-toggle.active,
    .existing-guide-toggle:hover{
      border-color:#efb8d0;
      background:#fff;
      color:var(--pink-deep);
    }

    .existing-guide-status{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:28px;
      padding:0 11px;
      border-radius:999px;
      border:1px solid #efb8d0;
      background:#fff;
      color:#d26f9e;
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }

    .existing-guide-body{display:block;padding:0;}

    .existing-guide-panel{
      padding:16px 18px;
      border-bottom:1px dashed rgba(239,184,208,.62);
    }

    .existing-guide-panel[hidden]{display:none!important;}

    .existing-guide-section{border:0;border-radius:0;background:transparent;padding:0;}

    .existing-guide-section strong{
      display:block;
      margin:0 0 8px;
      color:#d27ca8;
      font-size:15px;
      font-weight:900;
    }

    .existing-guide-text{
      margin:0;
      color:#8e697d;
      font-size:14px;
      line-height:1.75;
      font-weight:750;
      white-space:pre-wrap;
    }

    .existing-guide-memo{
      margin:0 0 12px;
      color:#a98298;
      font-size:13px;
      line-height:1.65;
      font-weight:800;
    }

    .existing-line-list{display:grid;gap:10px;padding:0;}

    .existing-line-card{
      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:11px;
      align-items:center;
      padding:12px 13px;
      border:1px solid rgba(242,207,224,.95);
      border-radius:16px;
      background:rgba(255,255,255,.78);
    }

    .existing-line-card .line-num{min-width:32px;height:32px;}
    .existing-line-title{min-width:0;}

    .existing-line-title strong{
      display:block;
      color:#73586a;
      font-size:14px;
      line-height:1.35;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .existing-line-title span{
      display:block;
      margin-top:3px;
      color:#a98298;
      font-size:12px;
      line-height:1.45;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .import-line-btn{
      min-height:34px;
      padding:0 14px;
      border:1px solid #efb8d0;
      border-radius:999px;
      background:#fff;
      color:#d26f9e;
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }

    .import-line-btn:hover{background:#fff0f7;color:var(--pink-deep);}

    .existing-empty-note{
      padding:14px 16px;
      border:1px dashed rgba(239,184,208,.9);
      border-radius:16px;
      background:#fff8fc;
      color:#a98298;
      font-size:14px;
      line-height:1.7;
      font-weight:800;
    }

    .agree-box{
      display:grid;
      gap:10px;
      padding:16px;
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(255,255,255,.64);
    }

    .checkline{
      display:flex;
      align-items:flex-start;
      gap:9px;
      color:#8e697d;
      font-size:15px;
      line-height:1.65;
      font-weight:800;
    }

    .checkline input{
      margin-top:4px;
      accent-color:var(--pink-deep);
    }

    .actions{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:10px;
      margin-top:24px;
    }

    .btn{
      min-height:44px;
      padding:0 20px;
      border:1px solid #efb8d0;
      border-radius:999px;
      background:#fff;
      color:#d26f9e;
      font-size:13px;
      font-weight:900;
      letter-spacing:-.01em;
    }

    .btn.primary{
      border-color:transparent;
      background:linear-gradient(180deg,#ff7fba,#ff59a5);
      color:#fff;
      box-shadow:0 12px 22px rgba(255,89,165,.18);
    }



    .existing-guide-more{
      border-top:1px dashed rgba(239,184,208,.78);
    }
    .existing-guide-more summary{
      list-style:none;
      cursor:pointer;
      padding:12px 16px;
      color:#d26f9e;
      font-size:13px;
      font-weight:900;
    }
    .existing-guide-more summary::-webkit-details-marker{display:none}
    .existing-line-list{
      display:grid;
      gap:10px;
      padding:12px 16px 16px;
      border-top:1px dashed rgba(239,184,208,.62);
    }
    .existing-line-card{
      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:10px;
      align-items:center;
      padding:12px 13px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
    }
    .existing-line-card .line-num{
      min-width:32px;
      height:32px;
    }
    .existing-line-title{
      min-width:0;
    }
    .existing-line-title strong{
      display:block;
      color:#73586a;
      font-size:14px;
      line-height:1.35;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .existing-line-title span{
      display:block;
      margin-top:3px;
      color:#a98298;
      font-size:12px;
      line-height:1.45;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .import-line-btn{
      min-height:34px;
      padding:0 13px;
      border:1px solid #efb8d0;
      border-radius:999px;
      background:#fff;
      color:#d26f9e;
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }


    @media(max-width:720px){
      .existing-guide-head{
        grid-template-columns:1fr auto;
        gap:10px;
      }
      .existing-guide-toggle{
        grid-column:1 / -1;
        justify-self:start;
        padding:2px 0 0;
      }
      .existing-line-card{
        grid-template-columns:auto 1fr;
      }
      .import-line-btn{
        grid-column:2;
        justify-self:start;
      }
    }

    .admin-preview{
      margin-top:22px;
      border:1px solid var(--line);
      border-radius:24px;
      background:rgba(255,255,255,.75);
      box-shadow:var(--soft-shadow);
      padding:18px;
    }

    .admin-preview h2{
      margin:0 0 12px;
      color:var(--text-strong);
      font-size:19px;
      font-weight:900;
      text-align:center;
    }

    .ticket-card{
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff;
      padding:15px;
    }

    .ticket-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      margin-bottom:10px;
    }

    .status-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:28px;
      padding:6px 10px;
      border-radius:999px;
      background:#fff0f7;
      color:var(--pink-deep);
      font-size:11px;
      font-weight:900;
      white-space:nowrap;
    }

    .ticket-title{
      color:#73586a;
      font-size:15px;
      font-weight:900;
      line-height:1.4;
    }

    .ticket-desc{
      margin:0;
      color:#967184;
      font-size:13px;
      line-height:1.75;
      font-weight:750;
    }

    @media(max-width:720px){
      body{padding:16px 12px}
      .mock-head{padding:24px 18px 20px}
      .form-body{padding:22px 18px 24px}
      .form-grid{grid-template-columns:1fr}
      .line-editor-summary{grid-template-columns:auto 1fr;align-items:start}
      .line-actions{grid-column:2;justify-content:flex-start;margin-top:6px}
      .ticket-top{flex-direction:column}
    }
  </style>
</head>
<body>
  <main class="mock-wrap">
    <section class="mock-card">
      <header class="mock-head">
        <div class="kicker">LUMIBELLE CHEER GUIDE</div>
        <h1>CHEER GUIDE 제보하기</h1>
        <p class="head-desc">
          루미나의 제보로 완성되는 루미벨 응원 가이드!<br />
          믹스콜, 리스폰스, 응원 포인트, 오타 수정이 있다면 아래에 맞춰 제보해 주세요.<br />
          ※ 운영 확인 및 공연 기준 검토 후 공식 CHEER GUIDE에 반영됩니다.
        </p>
      </header>

      <div class="form-body">
        <form class="form-grid">
          <div class="field">
            <label>곡 선택 <span class="required">*</span></label>
            <select class="select" id="songSelect" onchange="renderExistingGuide()">
              <option value="stardust-magical">Stardust Magical</option>
              <option value="storyberrylove">스토리베리 러브</option>
              <option value="shukipi">슈키피</option>
              <option value="canaria">카나리아</option>
              <option value="custom">직접 입력</option>
            </select>
          </div>

          <div class="field">
            <label>제보 유형 <span class="required">*</span></label>
            <select class="select">
              <option>콜 추가</option>
              <option>콜 수정</option>
              <option>믹스 추가</option>
              <option>믹스 수정</option>
              <option>오타 수정</option>
              <option>리스폰스 추가</option>
              <option>응원 포인트 추가</option>
              <option>구간 · 타이밍 수정</option>
              <option>영상 · 음원 링크 제보</option>
              <option>기타</option>
            </select>
          </div>

          <div class="field">
            <label>참고 링크</label>
            <input class="input" placeholder="영상 · 트윗 · 자료 링크 등" />
          </div>

          <div class="field">
            <label>참고 구간 · 시간</label>
            <input class="input" placeholder="예: 영상 01:23 · 2절 사비 직전 · 후렴 첫 줄" />
          </div>

          <div class="field full">
            <div class="section-label">
              <label>현재 등록된 가이드</label>
            </div>
            <div class="existing-guide-card" id="existingGuideCard">
              <div class="existing-guide-head">
                <div class="existing-guide-title" id="existingGuideTitle">Stardust Magical</div>
                <button class="existing-guide-toggle" id="existingLyricToggle" type="button" onclick="toggleExistingLyrics()">기존 가사 보기</button>
                <button class="existing-guide-toggle" id="existingCheerToggle" type="button" onclick="toggleExistingCheerGuide()">등록된 CHEER GUIDE 보기</button>
                <span class="existing-guide-status" id="existingGuideStatus">등록 내용 있음</span>
              </div>
              <div class="existing-guide-body" id="existingGuideBody"></div>
            </div>
          </div>


          <div class="field full">
            <label>제보 이유 · 운영자에게 남길 말</label>
            <div class="help">· 현장에서 자연스럽게 나온 콜이나 참고 이유가 있다면 함께 알려주세요.</div>
            <textarea class="textarea" placeholder="예: 지난 공연에서 이 타이밍에 자연스럽게 이름콜이 나왔고, 곡 분위기에도 잘 맞았어요."></textarea>
          </div>

          <div class="field full">
            <div class="section-label">
              <label>CHEER GUIDE 라인 제보 <span class="required">*</span></label>
            </div>

            <div class="line-editor-list">
              <details class="line-editor" open>
                <summary class="line-editor-summary">
                  <span class="line-num">01</span>
                  <span class="line-title-wrap">
                    <span class="line-title">새 라인 제보</span>
                    <span class="line-preview">구간과 응원 내용을 입력해 주세요.</span>
                  </span>
                  <span class="line-actions">
                    <span class="line-edit-hint">수정</span>
                    <button class="line-move-btn" type="button" disabled onclick="event.preventDefault();event.stopPropagation();moveFeedbackGuideLine(this, -1)">위로</button>
                    <button class="line-move-btn" type="button" disabled onclick="event.preventDefault();event.stopPropagation();moveFeedbackGuideLine(this, 1)">아래로</button>
                    <button class="line-delete-btn" type="button" onclick="event.preventDefault();event.stopPropagation();deleteFeedbackGuideLine(this)">삭제</button>
                  </span>
                </summary>
                <div class="line-editor-body">
                  <div class="form-grid">
                    <div class="field"><label>구간</label><input class="input" placeholder="예: 인트로 · A멜로 · 후렴 · 간주"></div>
                    <div class="field"><label>파트</label><input class="input" placeholder="예: 도입 · 메인 포인트 · 믹스 구간"></div>
                    <div class="field guide-lyric-field"><label>가사</label><textarea class="textarea" placeholder="해당 구간의 가사를 입력해 주세요."></textarea></div>
                    <div class="field guide-desc-field"><label>응원 설명</label><textarea class="textarea" placeholder="이 구간에서 어떻게 반응하면 좋은지 적어 주세요."></textarea></div>
                    <div class="field guide-tag-field"><label>태그</label><input class="input" placeholder="예: 박수, 리스폰스, 이름콜, 함성"></div>
                    <div class="field guide-call-field"><label>콜 · 응원 문구</label><textarea class="textarea" placeholder="예: “마리링!” 이름콜을 넣으면 좋을 것 같아요."></textarea></div>
                  </div>
                </div>
              </details>
            </div>

            <button class="add-line-btn" type="button" onclick="addFeedbackGuideLine()">+ 라인 추가</button>
          </div>

          <div class="field">
            <label>닉네임</label>
            <input class="input" placeholder="선택 입력" />
          </div>

          <div class="field">
            <label>연락 가능 정보</label>
            <input class="input" placeholder="SNS · 이메일 등 선택 입력" />
          </div>

          <div class="field full">
            <label>공개 · 확인 동의</label>
            <div class="agree-box">
              <label class="checkline"><input type="checkbox" /> 운영 확인을 위해 제출 내용을 내부에서 검토하는 것에 동의합니다.</label>
              <label class="checkline"><input type="checkbox" /> 제보가 반영될 경우, 응원가이드에 함께 기록되는 것에 동의합니다.</label>
              <label class="checkline"><input type="checkbox" /> 닉네임 공개를 원합니다. 공개를 원하지 않으면 체크하지 않아도 됩니다.</label>
            </div>
          </div>
        </form>

        <div class="actions">
          <button class="btn primary" type="button" onclick="submitCheerGuideFeedback()">제보 제출하기</button>
          <button class="btn" type="button" onclick="returnToSetlistPage()">취소</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    function getFeedbackLineList(){
      return document.querySelector('.line-editor-list');
    }

    function renumberFeedbackGuideLines(){
      const list = getFeedbackLineList();
      if(!list) return;
      const lines = Array.from(list.querySelectorAll('.line-editor'));
      lines.forEach((line, index) => {
        const num = line.querySelector('.line-num');
        const up = line.querySelector('.line-move-btn[onclick*="-1"]');
        const down = line.querySelector('.line-move-btn[onclick*=", 1"]');
        if(num) num.textContent = String(index + 1).padStart(2, '0');
        if(up) up.disabled = index === 0;
        if(down) down.disabled = index === lines.length - 1;
      });
    }

    function moveFeedbackGuideLine(button, direction){
      const line = button.closest('.line-editor');
      const list = getFeedbackLineList();
      if(!line || !list) return;
      const lines = Array.from(list.querySelectorAll('.line-editor'));
      const index = lines.indexOf(line);
      const target = index + direction;
      if(target < 0 || target >= lines.length) return;
      if(direction < 0) list.insertBefore(line, lines[target]);
      else list.insertBefore(lines[target], line);
      line.open = true;
      renumberFeedbackGuideLines();
    }

    function deleteFeedbackGuideLine(button){
      const line = button.closest('.line-editor');
      const list = getFeedbackLineList();
      if(!line || !list) return;
      const lines = list.querySelectorAll('.line-editor');
      if(lines.length <= 1){
        alert('최소 1개의 라인은 남겨두어야 해요.');
        return;
      }
      line.remove();
      renumberFeedbackGuideLines();
    }

    function escapeAttr(value){
      return String(value || '').replace(/[&<>"]/g, function(match){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[match];
      });
    }

    function getLineValues(line){
      const inputs = line.querySelectorAll('input, textarea');
      return Array.from(inputs).map(input => input.value.trim());
    }

    function isBlankFeedbackLine(line){
      return getLineValues(line).every(value => !value);
    }

    function buildFeedbackLineHTML(values = {}){
      const title = values.time || values.stage ? `${values.time || '구간'}${values.stage ? ' · ' + values.stage : ''}` : '새 라인 제보';
      const preview = values.desc || values.lyric || values.call || '구간과 응원 내용을 입력해 주세요.';
      return `
        <summary class="line-editor-summary">
          <span class="line-num">00</span>
          <span class="line-title-wrap">
            <span class="line-title">${escapeText(title)}</span>
            <span class="line-preview">${escapeText(preview)}</span>
          </span>
          <span class="line-actions">
            <span class="line-edit-hint">수정</span>
            <button class="line-move-btn" type="button" onclick="event.preventDefault();event.stopPropagation();moveFeedbackGuideLine(this, -1)">위로</button>
            <button class="line-move-btn" type="button" onclick="event.preventDefault();event.stopPropagation();moveFeedbackGuideLine(this, 1)">아래로</button>
            <button class="line-delete-btn" type="button" onclick="event.preventDefault();event.stopPropagation();deleteFeedbackGuideLine(this)">삭제</button>
          </span>
        </summary>
        <div class="line-editor-body">
          <div class="form-grid">
            <div class="field"><label>구간</label><input class="input" value="${escapeAttr(values.time || '')}" placeholder="예: 인트로 · A멜로 · 후렴 · 간주"></div>
            <div class="field"><label>파트</label><input class="input" value="${escapeAttr(values.stage || '')}" placeholder="예: 도입 · 메인 포인트 · 믹스 구간"></div>
            <div class="field guide-lyric-field"><label>가사</label><textarea class="textarea" placeholder="해당 구간의 가사를 입력해 주세요.">${escapeText(values.lyric || '')}</textarea></div>
            <div class="field guide-desc-field"><label>응원 설명</label><textarea class="textarea" placeholder="이 구간에서 어떻게 반응하면 좋은지 적어 주세요.">${escapeText(values.desc || '')}</textarea></div>
            <div class="field guide-tag-field"><label>태그</label><input class="input" value="${escapeAttr(values.tags || '')}" placeholder="예: 박수, 리스폰스, 이름콜, 함성"></div>
            <div class="field guide-call-field"><label>콜 · 응원 문구</label><textarea class="textarea" placeholder="예: “마리링!” 이름콜을 넣으면 좋을 것 같아요.">${escapeText(values.call || '')}</textarea></div>
          </div>
        </div>`;
    }

    function addFeedbackGuideLine(values = {}){
      const list = getFeedbackLineList();
      if(!list) return null;
      const detail = document.createElement('details');
      detail.className = 'line-editor';
      detail.open = true;
      detail.innerHTML = buildFeedbackLineHTML(values);
      list.appendChild(detail);
      renumberFeedbackGuideLines();
      return detail;
    }

    function replaceBlankLineOrAppend(values){
      const list = getFeedbackLineList();
      if(!list) return;
      const lines = Array.from(list.querySelectorAll('.line-editor'));
      let target = null;
      if(lines.length === 1 && isBlankFeedbackLine(lines[0])){
        target = lines[0];
        target.open = true;
        target.innerHTML = buildFeedbackLineHTML(values);
      }else{
        target = addFeedbackGuideLine(values);
      }
      renumberFeedbackGuideLines();
      if(target) target.scrollIntoView({behavior:'smooth', block:'center'});
    }

    function importExistingGuideLine(songKey, index){
      const data = existingGuideData[songKey] || existingGuideData.custom;
      const line = (data.lines || [])[index];
      if(!line) return;
      replaceBlankLineOrAppend(line);
    }

    const existingGuideData = {
      'stardust-magical': {
        title: 'Stardust Magical',
        hasGuide: true,
        lyrics: '기존 가사 일부 또는 전체 가사가 여기에 표시됩니다.\n실제 연동 시 관리자에 등록된 가사 데이터가 자동으로 불러와집니다.',
        mix: '현재 등록된 믹스콜 가이드가 있으면 이곳에 표시됩니다.',
        lines: [
          {time:'인트로 - A멜로', stage:'도입', lyric:'', desc:'큰 콜보다 분위기에 맞는 손흔들기와 박수 위주로 시작.', tags:'손흔들기, 박수', call:'콜: 과한 믹스보다 귀여운 호응이 더 잘 어울려요.'},
          {time:'후렴', stage:'메인 포인트', lyric:'', desc:'별, 마법, 반짝임 계열 가사 포인트에서 짧은 함성으로 반응.', tags:'후렴, 함성', call:'포인트: 안무 포인트에 맞춰 우와- 느낌으로 반응.'}
        ]
      },
      'storyberrylove': {
        title: '스토리베리 러브',
        hasGuide: false,
        lyrics: '등록된 가사가 있으면 이곳에 표시됩니다.',
        mix: '',
        lines: []
      },
      'shukipi': {
        title: '슈키피',
        hasGuide: true,
        lyrics: '커버곡 또는 참고 가사 정보가 있으면 이곳에 표시됩니다.',
        mix: '리스폰스 중심으로 정리 예정입니다.',
        lines: [
          {time:'인트로', stage:'도입', lyric:'', desc:'곡 분위기에 맞춰 박수 위주로 시작.', tags:'박수, 리스폰스', call:'콜: 멤버 리드에 맞춰 짧게 반응.'}
        ]
      },
      'canaria': {
        title: '카나리아',
        hasGuide: true,
        lyrics: '등록된 가사가 있으면 이곳에 표시됩니다.',
        mix: '등록된 믹스콜 가이드가 있으면 자동으로 표시됩니다.',
        lines: [
          {time:'후렴', stage:'합창 포인트', lyric:'', desc:'따뜻한 박수와 합창 느낌으로 함께 반응.', tags:'박수, 합창', call:''}
        ]
      },
      'custom': {
        title: '직접 입력',
        hasGuide: false,
        lyrics: '',
        mix: '',
        lines: []
      }
    };

    function escapeText(value){
      return String(value || '').replace(/[&<>"']/g, function(match){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[match];
      });
    }

    function renderExistingGuide(){
      const select = document.getElementById('songSelect');
      const titleEl = document.getElementById('existingGuideTitle');
      const statusEl = document.getElementById('existingGuideStatus');
      const bodyEl = document.getElementById('existingGuideBody');
      const lyricToggle = document.getElementById('existingLyricToggle');
      const cheerToggle = document.getElementById('existingCheerToggle');
      if(!select || !titleEl || !statusEl || !bodyEl) return;

      const songKey = select.value;
      const data = existingGuideData[songKey] || existingGuideData.custom;
      titleEl.textContent = data.title;
      statusEl.textContent = data.hasGuide ? '등록 내용 있음' : '등록 내용 없음';
      if(lyricToggle) lyricToggle.classList.remove('active');
      if(cheerToggle) cheerToggle.classList.remove('active');

      const lines = data.lines || [];
      const lineHtml = lines.length ? lines.map((line, index) => `
        <div class="existing-line-card">
          <span class="line-num">${String(index + 1).padStart(2, '0')}</span>
          <span class="existing-line-title">
            <strong>${escapeText((line.time || '구간') + (line.stage ? ' · ' + line.stage : ''))}</strong>
            <span>${escapeText(line.desc || line.lyric || line.call || '등록된 라인입니다.')}</span>
          </span>
          <button class="import-line-btn" type="button" onclick="importExistingGuideLine('${escapeAttr(songKey)}', ${index})">수정 제보</button>
        </div>`).join('') : `
        <div class="existing-empty-note">아직 등록된 CHEER GUIDE가 없어요. 아래 CHEER GUIDE 라인 제보에서 새 라인을 추가해 주세요.</div>`;

      bodyEl.innerHTML = `
        <div class="existing-guide-panel" id="existingLyricsPanel" hidden>
          <div class="existing-guide-section">
            <strong>기존 가사</strong>
            <p class="existing-guide-text">${escapeText(data.lyrics || '등록된 가사가 있으면 이곳에 표시됩니다.')}</p>
          </div>
        </div>
        <div class="existing-guide-panel" id="existingCheerPanel" hidden>
          <div class="existing-guide-section">
            <strong>등록된 CHEER GUIDE</strong>
            <p class="existing-guide-memo">수정하고 싶은 라인이 있다면 해당 라인의 [수정 제보] 버튼을 눌러 주세요.</p>
          </div>
          <div class="existing-line-list">
            ${lineHtml}
          </div>
        </div>`;
    }

    function toggleExistingPanel(panelId, buttonId){
      const panel = document.getElementById(panelId);
      const button = document.getElementById(buttonId);
      if(!panel || !button) return;
      const willOpen = panel.hasAttribute('hidden');
      if(willOpen){
        panel.removeAttribute('hidden');
        button.classList.add('active');
      }else{
        panel.setAttribute('hidden', '');
        button.classList.remove('active');
      }
    }

    function toggleExistingLyrics(){
      toggleExistingPanel('existingLyricsPanel', 'existingLyricToggle');
    }

    function toggleExistingCheerGuide(){
      toggleExistingPanel('existingCheerPanel', 'existingCheerToggle');
    }



    function getFeedbackQuerySong(){
      try{
        return new URLSearchParams(window.location.search).get('song') || '';
      }catch(e){
        return '';
      }
    }

    function applyFeedbackQuerySong(){
      const querySong = getFeedbackQuerySong();
      const select = document.getElementById('songSelect');
      if(!querySong || !select) return;
      const option = Array.from(select.options).find(item => item.value === querySong);
      if(option){
        select.value = querySong;
        renderExistingGuide();
      }
    }

    function returnToSetlistPage(){
      if(document.referrer && history.length > 1){
        history.back();
        return;
      }
      window.location.href = './setlist.html';
    }

    function submitCheerGuideFeedback(){
      alert('제보가 접수되었습니다. 운영 확인 후 응원가이드에 반영될 수 있어요.');
      returnToSetlistPage();
    }


    renderExistingGuide();
    applyFeedbackQuerySong();
    renumberFeedbackGuideLines();
  </script>
</body>
</html>
