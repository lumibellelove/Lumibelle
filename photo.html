<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>PHOTO ARCHIVE | LUMIBELLE</title>
<meta content="루미벨의 공연과 일상 속 사진 기록을 모아보는 PHOTO ARCHIVE입니다." name="description"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&amp;display=swap" rel="stylesheet"/>
<link href="./css/style.css?v=273" rel="stylesheet"/>
<link href="./css/photo.css?v=280" rel="stylesheet"/>
</head>
<body class="photo-archive-page">
<div class="site-shell">
<div data-site-chrome=""></div><script src="./js/site-chrome.js?v=297"></script>

<main class="subpage-main archive-page-main photo-archive-main">
<div data-video-shared-shell="photo"></div>
<script src="./js/video-shared-shell.js?v=291"></script>

<section aria-labelledby="photo-pick-title" class="photo-pick" data-photo-pick></section>

<section aria-labelledby="photo-results-title" class="video-results photo-results">
<header class="video-results-heading">
<div class="video-results-title-block">
<p>PHOTO LIST</p>
<div class="video-results-summary">
<h2 id="photo-results-title">전체 사진</h2>
<span aria-hidden="true" class="video-results-sparkle">✦</span>
<strong class="video-results-total">총 <span data-photo-result-count>0</span>개</strong>
</div>
</div>
</header>
<div class="video-card-grid" data-photo-grid></div>
<div class="video-empty" data-photo-empty hidden>
<strong>찾는 사진이 없습니다</strong>
<p>검색어나 필터 조건을 다시 확인해주세요.</p>
</div>
<button aria-expanded="false" class="video-load-more" data-photo-load-more type="button">
<span data-photo-load-more-label>사진 더보기</span>
<i aria-hidden="true"></i>
</button>
</section>
</main>

<div class="video-filter-overlay" data-photo-filter-overlay hidden></div>
<section aria-labelledby="photo-filter-title" aria-modal="true" class="video-filter-sheet" data-photo-filter-sheet hidden id="photo-filter-sheet" role="dialog">
<header class="video-filter-sheet-header">
<div><p>DETAIL FILTER</p><h2 id="photo-filter-title">상세 필터</h2></div>
<button aria-label="필터 닫기" data-photo-filter-close type="button"><i></i></button>
</header>
<div class="video-filter-sheet-body">
<fieldset>
<legend>카테고리</legend>
<div class="video-filter-options video-filter-options--wrap">
<label><input checked name="photo-category" type="radio" value="ALL"/><span>전체</span></label>
<label><input name="photo-category" type="radio" value="STAGE"/><span>무대</span></label>
<label><input name="photo-category" type="radio" value="BEHIND"/><span>비하인드</span></label>
<label><input name="photo-category" type="radio" value="FOCUS"/><span>직캠</span></label>
<label><input name="photo-category" type="radio" value="FANCAM"/><span>팬캠</span></label>
</div>
</fieldset>
<fieldset>
<legend>게시 기간</legend>
<div class="video-filter-options">
<label><input checked name="photo-period" type="radio" value="ALL"/><span>전체</span></label>
<label><input name="photo-period" type="radio" value="7"/><span>최근 7일</span></label>
<label><input name="photo-period" type="radio" value="30"/><span>최근 30일</span></label>
</div>
</fieldset>
</div>
<footer class="video-filter-sheet-footer">
<button data-photo-filter-reset type="button">초기화</button>
<button data-photo-filter-apply type="button">적용하기</button>
</footer>
</section>

<div aria-labelledby="photo-viewer-title" aria-modal="true" class="photo-viewer-modal" data-photo-viewer hidden role="dialog">
<div class="photo-viewer-backdrop" data-photo-viewer-backdrop></div>
<section class="photo-viewer-dialog" data-photo-viewer-dialog tabindex="-1">
<div class="photo-viewer-stage" data-photo-viewer-stage>
<div class="photo-viewer-media" data-photo-viewer-media>
<img alt="" data-photo-viewer-image hidden/>
<span aria-hidden="true" class="photo-viewer-empty"></span>
</div>
<div class="photo-viewer-top photo-viewer-ui">
<div class="photo-viewer-top-left">
<button aria-label="사진 뷰어 닫기" data-photo-viewer-close type="button"><i aria-hidden="true"></i></button>
<strong><span data-photo-viewer-current>1</span> / <span data-photo-viewer-total>1</span></strong>
</div>
<div class="photo-viewer-top-right">
<button aria-label="좋아요" aria-pressed="false" data-photo-viewer-like type="button">
<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 20.5S4 15.7 4 9.6C4 6.5 6 4.5 8.7 4.5c1.6 0 2.8.8 3.3 1.8.5-1 1.7-1.8 3.3-1.8C18 4.5 20 6.5 20 9.6c0 6.1-8 10.9-8 10.9Z"></path></svg>
</button>
<button aria-label="사진 공유" data-photo-viewer-share type="button">
<svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.3"></circle><circle cx="18" cy="6" r="2.3"></circle><circle cx="18" cy="18" r="2.3"></circle><path d="m8 11 7.8-4m-7.8 6 7.8 4"></path></svg>
</button>
</div>
</div>
<button aria-label="이전 사진" class="photo-viewer-arrow photo-viewer-arrow--prev photo-viewer-ui" data-photo-viewer-prev type="button"><i aria-hidden="true"></i></button>
<button aria-label="다음 사진" class="photo-viewer-arrow photo-viewer-arrow--next photo-viewer-ui" data-photo-viewer-next type="button"><i aria-hidden="true"></i></button>
</div>
<div class="photo-viewer-info photo-viewer-ui">
<div class="photo-viewer-copy">
<p><time data-photo-viewer-date></time><span data-photo-viewer-category></span></p>
<h2 id="photo-viewer-title" data-photo-viewer-title>사진 제목</h2>
<p data-photo-viewer-description></p>
</div>
<button aria-disabled="true" aria-label="다운로드 준비 중" class="photo-viewer-download" data-photo-viewer-download disabled type="button">
<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"></path></svg>
<span>다운로드</span>
</button>
</div>
<div class="photo-viewer-thumbs photo-viewer-ui" data-photo-viewer-thumbs></div>
</section>
</div>

</nav>
</div>
<script src="./js/main.js?v=273"></script>
<script src="./js/photo.js?v=280"></script>
</body>
</html>
