<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7dce5" />
  <title>루미폰 스탭 로그인</title>
  <link rel="stylesheet" href="css/staff-login.css" />
  <link rel="stylesheet" href="css/staff-login.iphone.css" />
  <link rel="stylesheet" href="css/staff-login.galaxy.css" />
</head>
<body>
  <main class="staff-login-page" data-screen="regular-staff-login">
    <section class="login-shell" aria-label="루미폰 정규 스탭 로그인">
      <section class="login-hero" aria-label="로그인 상단 영역">
        <div class="hero-art" aria-hidden="true"></div>
        <div class="hero-crown" aria-hidden="true">♡</div>
        <div class="hero-logo">Lumiphone</div>
        <div class="hero-ribbon">STAFF MODE</div>
        <h1 class="hero-title">루미폰 스탭 로그인</h1>
        <div class="event-pill" role="status" aria-live="polite">
          <span class="event-pill-icon" aria-hidden="true">✓</span>
          <span>오늘 공연 연결 완료</span>
        </div>
      </section>

      <section class="login-panel" aria-label="정규 스탭 로그인 카드">
        <form class="regular-login-form" id="regularLoginForm">
          <label class="staff-code-field" for="staffCode">
            <span class="field-label">
              <span class="field-icon" aria-hidden="true">⌘</span>
              <span>스탭 코드</span>
            </span>
            <input id="staffCode" name="staffCode" type="text" inputmode="text" autocomplete="username" placeholder="스탭 코드를 입력하세요" />
          </label>

          <section class="password-login-panel" id="passwordLoginPanel" hidden aria-label="비밀번호 로그인">
            <label class="field-group" for="staffPassword">
              <span class="field-label">비밀번호 로그인</span>
              <input id="staffPassword" name="staffPassword" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" />
            </label>
          </section>

          <div class="section-divider" id="modeDivider" aria-hidden="true">
            <span></span>
            <em>♥</em>
            <span></span>
          </div>

          <section class="pin-login-section" id="pinLoginSection" aria-label="빠른 로그인">
            <div class="pin-copy">
              <p class="pin-title"><span class="field-icon" aria-hidden="true">⌂</span> 빠른 로그인</p>
              <p class="pin-desc">PIN 4자리를 입력하세요</p>
            </div>

            <div class="pin-dots" id="pinDots" aria-label="PIN 입력 상태">
              <span class="pin-dot"></span>
              <span class="pin-dot"></span>
              <span class="pin-dot"></span>
              <span class="pin-dot"></span>
            </div>

            <input id="pinValue" name="pinValue" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password" class="sr-only" />

            <div class="keypad" aria-label="숫자 키패드">
              <button type="button" class="keypad-key" data-key="1">1</button>
              <button type="button" class="keypad-key" data-key="2">2</button>
              <button type="button" class="keypad-key" data-key="3">3</button>
              <button type="button" class="keypad-key" data-key="4">4</button>
              <button type="button" class="keypad-key" data-key="5">5</button>
              <button type="button" class="keypad-key" data-key="6">6</button>
              <button type="button" class="keypad-key" data-key="7">7</button>
              <button type="button" class="keypad-key" data-key="8">8</button>
              <button type="button" class="keypad-key" data-key="9">9</button>
              <button type="button" class="keypad-key keypad-key--icon" data-action="love" aria-label="하트 키">♥</button>
              <button type="button" class="keypad-key" data-key="0">0</button>
              <button type="button" class="keypad-key keypad-key--icon" data-action="delete" aria-label="삭제">⌫</button>
            </div>
          </section>

          <div class="section-divider section-divider--text" id="loginModeDivider" aria-hidden="true">
            <span></span>
            <strong>또는 비밀번호 로그인</strong>
            <span></span>
          </div>

          <button class="password-toggle" id="passwordToggle" type="button" aria-expanded="false" aria-controls="passwordLoginPanel">
            <span class="password-toggle-left">
              <span class="field-icon" aria-hidden="true">⌂</span>
              <span class="password-toggle-text">비밀번호로 로그인</span>
            </span>
            <span class="password-toggle-arrow" aria-hidden="true">›</span>
          </button>

          <button class="login-submit" type="submit">로그인</button>
          <p class="login-message" id="loginMessage" role="status" aria-live="polite"></p>
        </form>
      </section>

      <footer class="security-note" aria-label="보안 접속 안내">
        <p class="security-title">보안 접속</p>
        <p class="security-copy">모든 접속은 암호화되어 안전하게 보호됩니다.</p>
      </footer>
    </section>
  </main>

  <script src="js/staff-login.js"></script>
</body>
</html>
