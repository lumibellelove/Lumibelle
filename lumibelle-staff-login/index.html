<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f9d9e5" />
  <title>루미벨 스탭 OS - 로그인</title>
  <link rel="stylesheet" href="css/staff-login.css" />
  <link rel="stylesheet" href="css/staff-login.iphone.css" />
  <link rel="stylesheet" href="css/staff-login.galaxy.css" />
</head>
<body>
  <main class="staff-login-page" data-screen="staff-login">
    <div class="login-bg-slot" aria-hidden="true"></div>

    <section class="login-shell" aria-label="루미벨 스탭 OS 로그인">
      <header class="login-statusbar" aria-label="기기 상태 영역">
        <span class="status-brand">Lumibelle Staff OS</span>
        <span class="status-time" id="statusTime">--:--</span>
        <span class="status-battery" aria-hidden="true">◇</span>
      </header>

      <section class="login-hero">
        <div class="asset-slot crown-slot" aria-hidden="true"></div>
        <div class="asset-slot logo-slot" aria-label="Lumiphone Staff Mode">
          <span class="logo-text">Lumiphone</span>
        </div>
        <div class="asset-slot ribbon-slot" aria-hidden="true">
          <span>STAFF MODE</span>
        </div>
        <p class="hero-copy">공연장 접수 데스크 전용 로그인</p>
      </section>

      <section class="login-panel">
        <div class="asset-slot panel-corner panel-corner-left" aria-hidden="true"></div>
        <div class="asset-slot panel-corner panel-corner-right" aria-hidden="true"></div>

        <div class="panel-heading">
          <p class="eyebrow">Maison Lumibelle</p>
          <h1>스탭 로그인</h1>
          <p>오늘 공연을 선택하고 담당 계정으로 입장해 주세요.</p>
        </div>

        <form class="login-form" id="staffLoginForm">
          <label class="field-group" for="staffId">
            <span>스탭 ID</span>
            <input id="staffId" name="staffId" type="text" inputmode="text" autocomplete="username" placeholder="staff id" />
          </label>

          <label class="field-group" for="staffPassword">
            <span>비밀번호</span>
            <input id="staffPassword" name="staffPassword" type="password" autocomplete="current-password" placeholder="password" />
          </label>

          <label class="field-group" for="todayEvent">
            <span>오늘 공연</span>
            <select id="todayEvent" name="todayEvent">
              <option value="debut-live">Shine Me UP : 루미벨 데뷔 라이브</option>
              <option value="manual">공연 선택 예정</option>
            </select>
          </label>

          <button class="login-submit" type="submit">
            <span class="button-shine" aria-hidden="true"></span>
            <span>로그인</span>
          </button>

          <button class="login-reset" type="button">비밀번호 재설정 / 계정 문의</button>
          <p class="login-message" id="loginMessage" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="today-event-card" aria-label="오늘 공연 정보">
        <div class="event-text">
          <p class="event-label">TODAY EVENT</p>
          <h2>Shine Me UP</h2>
          <p class="event-desc">루미벨 데뷔 라이브 운영 준비 화면</p>
          <dl class="event-meta">
            <div>
              <dt>공연일</dt>
              <dd>2026.07.12</dd>
            </div>
            <div>
              <dt>스탭 체크인</dt>
              <dd>현장 도착 후 확인</dd>
            </div>
          </dl>
        </div>
        <div class="asset-slot event-illust-slot" aria-hidden="true"></div>
      </section>

      <footer class="login-footer">
        <span>입장 확인 · 물판 · 특전 사용 · 정산 보조</span>
      </footer>
    </section>
  </main>

  <script src="js/staff-login.js"></script>
</body>
</html>
