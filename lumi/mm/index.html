<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>루미벨 메아테 조회</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="team-shell">
    <section class="team-phone">
      <header class="team-topbar">
        <span></span>
        <strong>메아테 조회</strong>
        <span></span>
      </header>

      <section class="team-view" data-view="login">
        <article class="team-card team-login-card">
          <div class="team-event-head">
            <div>
              <span>루미벨 데뷔 라이브</span>
              <h1>팀별 메아테 명단</h1>
            </div>
            <b>조회 전용</b>
          </div>

          <label class="team-field">
            <span>팀 선택</span>
            <select data-team-select>
              <option>Lumibelle</option>
              <option>이토리</option>
              <option>시로나</option>
              <option>옵시드</option>
              <option>너에게 닿기를</option>
              <option>스이타</option>
            </select>
          </label>

          <label class="team-field">
            <span>확인번호</span>
            <input data-team-code type="password" inputmode="numeric" autocomplete="off" placeholder="확인번호 입력" />
          </label>

          <button type="button" class="team-primary" data-action="lookup">조회하기</button>

          <p class="team-safe-note">해당 팀 메아테 명단만 표시됩니다.</p>
        </article>
      </section>

      <section class="team-view" data-view="list" hidden>
        <article class="team-card team-summary">
          <div>
            <span>조회 팀</span>
            <h1 data-result-team>-</h1>
          </div>
          <div class="team-summary-actions">
            <button type="button" data-action="refresh">새로고침</button>
            <button type="button" data-action="logout">다시 조회</button>
          </div>
        </article>

        <section class="team-counts">
          <article><span>총</span><strong data-count-total>0</strong></article>
          <article><span>사전</span><strong data-count-reserved>0</strong></article>
          <article><span>현장</span><strong data-count-walkin>0</strong></article>
          <article><span>수령</span><strong data-count-received>0</strong></article>
        </section>

        <section class="team-list" data-list></section>
      </section>

      <section class="team-view" data-view="message" hidden>
        <article class="team-card team-message">
          <strong data-message-title>확인 필요</strong>
          <p data-message-text>입력 정보를 확인해주세요.</p>
          <button type="button" class="team-primary" data-action="back">돌아가기</button>
        </article>
      </section>
    </section>
  </main>

  <script>
    window.LUMIBELLE_MEATE_API_URL = "https://script.google.com/macros/s/AKfycbwJRbaZDXnquhBTYaa4R1Onaq0pkDLUWPip0pjzoAcdkcUVNYCCZ2wHWtzCyQLZ0sboJQ/exec";
  </script>
  <script src="app.js"></script>
</body>
</html>
