<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MORE VIDEO 관리자 전체 목업 v17</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=SUIT:wght@400;500;700;800;900&display=swap');
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  font-family:"SUIT","Noto Sans KR",sans-serif;
  background:
    radial-gradient(circle at 0 0,rgba(255,218,235,.75),transparent 36%),
    radial-gradient(circle at 100% 0,rgba(235,218,255,.75),transparent 36%),
    #fff7fb;
  color:#846f81;
  letter-spacing:-0.02em;
}
.page{
  width:min(1320px,calc(100% - 48px));
  margin:28px auto 56px;
}
.panel{
  background:rgba(255,255,255,.96);
  border:1px solid #f2d8e7;
  border-radius:32px;
  padding:28px;
  box-shadow:0 14px 34px rgba(232,191,211,.13);
}
.head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  margin-bottom:18px;
}
.head h1{
  margin:0;
  color:#d77ca7;
  font-size:36px;
  font-weight:900;
}
.head p{
  margin:12px 0 0;
  color:#8f7183;
  font-size:18px;
  font-weight:800;
}
.btn-primary{
  border:0;
  border-radius:999px;
  background:linear-gradient(180deg,#ff7eb3,#ff4fa3);
  color:#fff;
  font-size:16px;
  font-weight:900;
  padding:16px 24px;
  box-shadow:0 12px 24px rgba(255,95,165,.22);
  cursor:pointer;
}
.btn-sub{
  border:1px solid #f0bfd4;
  border-radius:999px;
  background:#fff;
  color:#d77ca7;
  font-size:14px;
  font-weight:900;
  padding:11px 18px;
  cursor:pointer;
}
.btn-sub.warn{
  color:#d98a5f;
  border-color:#f3c7ad;
}
.filters{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:16px;
}
.chip{
  border:1px solid #f0bfd4;
  border-radius:999px;
  background:#fff;
  color:#d77ca7;
  font-size:14px;
  font-weight:900;
  padding:11px 18px;
  cursor:pointer;
}
.chip.active{
  background:#ff4fa3;
  border-color:#ff4fa3;
  color:#fff;
}
.controls{
  display:grid;
  grid-template-columns:1.55fr .82fr .82fr .82fr .72fr;
  gap:12px;
  margin-bottom:14px;
}
input,select,textarea{
  width:100%;
  border:1px solid #f0bfd4;
  border-radius:999px;
  background:#fff;
  color:#846f81;
  font-size:14px;
  font-weight:800;
  padding:14px 16px;
  font-family:inherit;
  outline:none;
}
textarea{
  border-radius:20px;
  min-height:158px;
  resize:vertical;
  line-height:1.6;
}
input:focus,select:focus,textarea:focus{
  border-color:#ff9fc7;
  box-shadow:0 0 0 4px rgba(255,171,211,.16);
}
.bulk{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  background:#fff8fc;
  border:1px solid #f2d8e7;
  border-radius:24px;
  padding:16px 18px;
  margin-bottom:14px;
}
.bulk .select-all{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-size:15px;
  font-weight:900;
  color:#9a738b;
  white-space:nowrap;
}
.bulk .select-all input{
  margin:0;
}
.bulk .actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.table{
  border:1px solid #f2d8e7;
  border-radius:28px;
  overflow:hidden;
  background:#fff;
}
.table-head,
.video-row{
  display:grid;
  grid-template-columns:54px minmax(270px,1.9fr) .7fr .9fr .8fr .9fr .7fr .7fr .8fr 220px;
  gap:10px;
  align-items:center;
}
.table-head{
  padding:14px 20px;
  background:#fff8fc;
  border-bottom:1px solid #f2d8e7;
  color:#b688a2;
  font-size:16px;
  font-weight:900;
}
.empty{
  padding:62px 20px 66px;
  text-align:center;
}
.empty .icon{
  width:88px;
  height:88px;
  border-radius:50%;
  margin:0 auto 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(180deg,#fff0f7,#f6edff);
  border:1px solid #f2d8e7;
  color:#ff59a5;
  font-size:34px;
  font-weight:900;
}
.empty h2{
  margin:0;
  color:#d77ca7;
  font-size:26px;
  font-weight:900;
}
.empty p{
  margin:12px 0 22px;
  color:#9c8092;
  font-size:16px;
  font-weight:800;
}
.video-row{
  padding:14px 20px;
  border-top:1px solid #f2d8e7;
}
.video-cell{
  display:grid;
  grid-template-columns:150px minmax(0,1fr);
  gap:14px;
  align-items:center;
}
.video-thumb{
  position:relative;
  aspect-ratio:16/9;
  border-radius:13px;
  overflow:hidden;
  border:1px solid #f0dde8;
  background:#ffe3ef;
}
.video-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.video-thumb::after{
  content:"▶";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(255,255,255,.94);
  color:#ef67a8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:900;
}
.video-title{
  color:#846f81;
  font-size:15.5px;
  font-weight:900;
  line-height:1.45;
  margin-bottom:5px;
}
.video-desc{
  color:#ab869c;
  font-size:12.5px;
  font-weight:700;
  line-height:1.5;
}
.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:26px;
  padding:6px 11px;
  border-radius:999px;
  font-size:11px;
  line-height:1;
  font-weight:900;
  background:#fff;
  border:1px solid #efc6dc;
  color:#c97ca8;
  white-space:nowrap;
}
.badge.public{
  border-color:#9ed7ba;
  color:#4aa071;
}
.badge.draft{
  border-color:#e0d0e9;
  color:#9279a2;
  background:#f5eff8;
}
.metric{
  color:#846f81;
  font-size:13px;
  font-weight:900;
}
.small{
  display:block;
  margin-top:5px;
  color:#b8a0ae;
  font-size:11px;
  font-weight:800;
}
.row-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  white-space:nowrap;
}
.pager{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:26px;
  margin-top:18px;
  color:#9b7d90;
  font-size:16px;
  font-weight:900;
}
.circle{
  width:36px;
  height:36px;
  border-radius:50%;
  border:1px solid #f4d7e6;
  background:#fff;
  color:#e7b3cc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:900;
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:26px;
  background:rgba(45,20,36,.46);
  backdrop-filter:blur(8px);
}
.modal.show{
  display:flex;
}
.modal-panel{
  width:min(1160px,100%);
  max-height:calc(100vh - 52px);
  overflow:auto;
  background:#fffafc;
  border:1px solid #f2d8e7;
  border-radius:30px;
  box-shadow:0 24px 60px rgba(45,20,36,.22);
}
.modal-head{
  position:sticky;
  top:0;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 24px;
  border-bottom:1px solid #f2d8e7;
  background:rgba(255,250,252,.96);
}
.modal-head h2{
  margin:0;
  color:#d77ca7;
  font-size:25px;
  font-weight:900;
}
.modal-close{
  border:1px solid #f0bfd4;
  border-radius:999px;
  background:#fff;
  color:#d77ca7;
  font-size:14px;
  font-weight:900;
  padding:10px 18px;
  cursor:pointer;
}
.modal-body{
  display:grid;
  grid-template-columns:minmax(0,1.03fr) minmax(390px,.82fr);
  gap:20px;
  padding:20px 24px 24px;
}
.card{
  background:#fff;
  border:1px solid #f2d8e7;
  border-radius:26px;
  padding:18px;
}
.form-card{
  min-height:760px;
  display:flex;
  flex-direction:column;
}
.status-row,
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.status-row{
  margin-bottom:14px;
}
.form-grid .full{
  grid-column:1/-1;
}
label{
  display:block;
  color:#d77ca7;
  font-size:16px;
  font-weight:900;
  padding-left:8px;
}
label input,
label select,
label textarea{
  margin-top:8px;
  margin-left:-8px;
}
.save-row{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:10px;
  margin-top:auto;
  padding-top:18px;
}
.save-row .btn-sub,
.save-row .btn-primary{
  font-size:14px;
  padding:12px 20px;
}
.preview-col{
  display:grid;
  gap:14px;
}
.preview-title{
  margin:0 0 12px;
  color:#d77ca7;
  font-size:18px;
  font-weight:900;
  text-align:center;
}
.public-card{
  width:min(430px,100%);
  margin:0 auto;
  background:#fff;
  border:2px solid #ff90be;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 12px 26px rgba(255,95,165,.16);
}
.public-thumb{
  position:relative;
  aspect-ratio:16/9;
  overflow:hidden;
  background:#ffe3ef;
}
.public-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.public-thumb::after{
  content:"▶";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:64px;
  height:64px;
  border-radius:50%;
  background:rgba(255,255,255,.94);
  color:#ef67a8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:900;
}
.badge-pick,.badge-new,.badge-tag{
  border-radius:999px;
  font-size:11px;
  font-weight:900;
  line-height:1;
}
.badge-pick{
  position:absolute;
  left:12px;
  top:12px;
  padding:7px 10px;
  background:rgba(255,255,255,.96);
  color:#ef67a8;
  display:none;
}
.badge-new{
  position:absolute;
  right:12px;
  top:12px;
  padding:7px 10px;
  background:#ff4fa3;
  color:#fff;
}
.public-body{
  padding:16px;
}
.meta-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.public-date{
  font-size:13px;
  font-weight:800;
  color:#c99ab2;
}
.badge-tag{
  padding:6px 10px;
  background:#fbe8f4;
  color:#c97ca8;
  border:1px solid #efc6dc;
}
.public-name{
  color:#846f81;
  font-size:17px;
  font-weight:900;
  line-height:1.5;
  margin-bottom:8px;
}
.public-sub{
  color:#ab869c;
  font-size:13px;
  font-weight:700;
  line-height:1.6;
}
.thumb-picker{
  text-align:center;
}
.pick-img{
  position:relative;
  width:min(340px,100%);
  margin:0 auto 14px;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:18px;
  border:1px solid #f0dde8;
  background:#ffe3ef;
}
.pick-img img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.pick-img::after{
  content:"▶";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.94);
  color:#ef67a8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:900;
}
.thumb-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.thumb-actions .wide{
  grid-column:1/-1;
}
.thumb-actions .btn-sub{
  font-size:14px;
  padding:12px 18px;
}

/* recent image modal */
.recent-modal{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(45,20,36,.48);
  backdrop-filter:blur(7px);
}
.recent-modal.show{
  display:flex;
}
.recent-panel{
  width:min(860px,100%);
  max-height:calc(100vh - 48px);
  overflow:auto;
  background:#fffafc;
  border:1px solid #f2d8e7;
  border-radius:28px;
  box-shadow:0 24px 60px rgba(45,20,36,.22);
  padding:22px;
}
.recent-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
}
.recent-head h3{
  margin:0;
  color:#d77ca7;
  font-size:24px;
  font-weight:900;
}
.recent-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.recent-item{
  border:1px solid #f2d8e7;
  background:#fff;
  border-radius:18px;
  padding:8px;
  cursor:pointer;
  text-align:left;
}
.recent-item:hover{
  border-color:#ff9fc7;
  box-shadow:0 10px 24px rgba(232,191,211,.16);
  transform:translateY(-2px);
}
.recent-item img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  display:block;
  border-radius:13px;
  background:#ffe3ef;
}
.recent-name{
  margin-top:8px;
  color:#8f7183;
  font-size:11.5px;
  font-weight:900;
  line-height:1.45;
}
@media(max-width:1180px){
  .controls{
    grid-template-columns:1fr 1fr;
  }
  .table-head{
    display:none;
  }
  .video-row{
    grid-template-columns:34px minmax(0,1fr) auto;
  }
  .video-row > div:nth-child(n+3):not(.row-actions){
    display:none;
  }
  .modal-body{
    grid-template-columns:1fr;
  }
}
@media(max-width:780px){
  .page{
    width:min(100% - 24px,1320px);
  }
  .head{
    flex-direction:column;
    align-items:flex-start;
  }
  .status-row,.form-grid,.thumb-actions{
    grid-template-columns:1fr;
  }
  .recent-grid{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>
<body>
<main class="page">
  <section class="panel">
    <div class="head">
      <div>
        <h1>MORE VIDEO 관리</h1>
        <p>영상 목록과 등록 상태를 관리합니다.</p>
      </div>
      <button class="btn-primary js-open-modal">영상 등록</button>
    </div>

    <div class="filters">
      <button class="chip active">전체</button>
      <button class="chip">공개</button>
      <button class="chip">비공개</button>
      <button class="chip">임시등록</button>
      <button class="chip">PICK</button>
      <button class="chip">아이돌 라이브</button>
      <button class="chip">방송/출연</button>
      <button class="chip">직캠</button>
      <button class="chip">쇼츠</button>
      <button class="chip">틱톡</button>
    </div>

    <div class="controls">
      <input placeholder="영상 제목 / 멤버 / 링크 검색" />
      <select><option>멤버 전체</option></select>
      <select><option>플랫폼 전체</option></select>
      <select><option>게시 상태</option></select>
      <select><option>최신순</option></select>
    </div>

    <div class="bulk">
      <label class="select-all"><input type="checkbox" /> 전체 선택</label>
      <div class="actions">
        <button class="btn-sub">선택 공개</button>
        <button class="btn-sub">선택 비공개</button>
        <button class="btn-sub warn">선택 삭제</button>
      </div>
    </div>

    <div class="table" id="table">
      <div class="table-head">
        <div></div>
        <div>영상</div>
        <div>유형</div>
        <div>게시 상태</div>
        <div>멤버</div>
        <div>카테고리</div>
        <div>날짜</div>
        <div>조회수</div>
        <div>반짝응원</div>
        <div>관리</div>
      </div>

      <div class="empty" id="emptyState">
        <div class="icon">▶</div>
        <h2>등록된 영상이 아직 없습니다</h2>
        <p>첫 영상을 등록하면 목록에 표시됩니다.</p>
        <button class="btn-primary js-open-modal">첫 영상 등록</button>
      </div>
    </div>

    <div class="pager">
      <span class="circle">‹</span>
      <span id="pagerText">0 / 0</span>
      <span class="circle">›</span>
    </div>
  </section>
</main>

<div class="modal" id="videoModal">
  <div class="modal-panel">
    <div class="modal-head">
      <h2>영상 등록</h2>
      <button class="modal-close" id="closeModal">닫기</button>
    </div>

    <div class="modal-body">
      <section class="card form-card">
        <div class="status-row">
          <label>게시 상태
            <select id="statusInput">
              <option>공개</option>
              <option>비공개</option>
              <option>임시등록</option>
            </select>
          </label>
          <label>운영 PICK
            <select id="pickInput">
              <option>OFF</option>
              <option>ON</option>
            </select>
          </label>
        </div>

        <div class="form-grid">
          <label class="full">영상 제목
            <input id="titleInput" placeholder="예: Stardust Magical Teaser" />
          </label>
          <label>게시일
            <input id="dateInput" type="date" value="2026-05-16" />
          </label>
          <label>플랫폼
            <select id="platformInput">
              <option>YOUTUBE</option>
              <option>TIKTOK</option>
            </select>
          </label>
          <label>멤버
            <select id="memberInput">
              <option>MARIRING</option>
              <option>LULU</option>
              <option>IRO</option>
              <option>LUNAR</option>
              <option>ALL</option>
            </select>
          </label>
          <label>카테고리
            <select id="categoryInput">
              <option>방송/출연</option>
              <option>아이돌 라이브</option>
              <option>방송 다시보기</option>
              <option>하이라이트</option>
              <option>직캠</option>
              <option>클립</option>
              <option>쇼츠</option>
              <option>틱톡</option>
              <option>합방</option>
            </select>
          </label>
          <label class="full">YouTube URL / TikTok URL
            <input id="urlInput" placeholder="https://www.youtube.com/watch?v=..." />
          </label>
          <label>시작 시간 초
            <input id="startInput" placeholder="예: 964" />
          </label>
          <label>종료 시간 초
            <input id="endInput" placeholder="예: 1165" />
          </label>
          <label class="full">설명
            <textarea id="descInput" placeholder="영상 설명을 입력합니다."></textarea>
          </label>
        </div>

        <div class="save-row">
          <button class="btn-sub" id="draftSave">임시저장</button>
          <button class="btn-primary" id="saveVideo">저장</button>
        </div>
      </section>

      <aside class="preview-col">
        <section class="card">
          <h3 class="preview-title">공홈 카드 미리보기</h3>
          <article class="public-card">
            <div class="public-thumb">
              <img id="previewImage" src="data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22640%22%20height%3D%22360%22%20viewBox%3D%220%200%20640%20360%22%3E%3Crect%20width%3D%22640%22%20height%3D%22360%22%20fill%3D%22%23ffe3ef%22/%3E%3Ccircle%20cx%3D%22320%22%20cy%3D%22180%22%20r%3D%2254%22%20fill%3D%22%23fff%22%20opacity%3D%220.92%22/%3E%3Cpath%20d%3D%22M306%20150%20L306%20210%20L356%20180%20Z%22%20fill%3D%22%23ef67a8%22/%3E%3Ctext%20x%3D%22320%22%20y%3D%22285%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2C%20sans-serif%22%20font-size%3D%2224%22%20font-weight%3D%22700%22%20fill%3D%22%23c97ca8%22%3EVIDEO%20THUMBNAIL%3C/text%3E%3C/svg%3E" alt="" />
              <span id="pickBadge" class="badge-pick">PICK</span>
              <span class="badge-new">NEW</span>
            </div>
            <div class="public-body">
              <div class="meta-top">
                <div id="previewDate" class="public-date">2026.05.16</div>
                <div id="previewPlatform" class="badge-tag">YOUTUBE</div>
              </div>
              <div id="previewTitle" class="public-name">새 영상 제목</div>
              <div id="previewMember" class="public-sub">MARIRING · SPECIAL</div>
              <div id="previewCategory" class="public-sub">방송/출연</div>
              <div class="public-sub">조회수 0회 · 반짝응원 0개</div>
            </div>
          </article>
        </section>

        <section class="card thumb-picker">
          <h3 class="preview-title">썸네일</h3>
          <div class="pick-img">
            <img id="thumbPreview" src="data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22640%22%20height%3D%22360%22%20viewBox%3D%220%200%20640%20360%22%3E%3Crect%20width%3D%22640%22%20height%3D%22360%22%20fill%3D%22%23ffe3ef%22/%3E%3Ccircle%20cx%3D%22320%22%20cy%3D%22180%22%20r%3D%2254%22%20fill%3D%22%23fff%22%20opacity%3D%220.92%22/%3E%3Cpath%20d%3D%22M306%20150%20L306%20210%20L356%20180%20Z%22%20fill%3D%22%23ef67a8%22/%3E%3Ctext%20x%3D%22320%22%20y%3D%22285%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2C%20sans-serif%22%20font-size%3D%2224%22%20font-weight%3D%22700%22%20fill%3D%22%23c97ca8%22%3EVIDEO%20THUMBNAIL%3C/text%3E%3C/svg%3E" alt="" />
          </div>
          <div class="thumb-actions">
            <button class="btn-sub" id="openRecent">최근 사진에서 선택</button>
            <button class="btn-sub">새 썸네일 업로드</button>
            <button class="btn-sub wide" id="youtubeThumb">YouTube 자동 썸네일</button>
          </div>
          <input id="thumbInput" type="hidden" value="data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22640%22%20height%3D%22360%22%20viewBox%3D%220%200%20640%20360%22%3E%3Crect%20width%3D%22640%22%20height%3D%22360%22%20fill%3D%22%23ffe3ef%22/%3E%3Ccircle%20cx%3D%22320%22%20cy%3D%22180%22%20r%3D%2254%22%20fill%3D%22%23fff%22%20opacity%3D%220.92%22/%3E%3Cpath%20d%3D%22M306%20150%20L306%20210%20L356%20180%20Z%22%20fill%3D%22%23ef67a8%22/%3E%3Ctext%20x%3D%22320%22%20y%3D%22285%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2C%20sans-serif%22%20font-size%3D%2224%22%20font-weight%3D%22700%22%20fill%3D%22%23c97ca8%22%3EVIDEO%20THUMBNAIL%3C/text%3E%3C/svg%3E" />
        </section>
      </aside>
    </div>
  </div>
</div>

<div class="recent-modal" id="recentModal">
  <div class="recent-panel">
    <div class="recent-head">
      <h3>최근 사진에서 선택</h3>
      <button class="btn-sub" id="closeRecent">닫기</button>
    </div>
    <div class="recent-grid" id="recentGrid"></div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'lumibelleVideoItemsV1';
  const PLACEHOLDER_THUMB = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22640%22%20height%3D%22360%22%20viewBox%3D%220%200%20640%20360%22%3E%3Crect%20width%3D%22640%22%20height%3D%22360%22%20fill%3D%22%23ffe3ef%22/%3E%3Ccircle%20cx%3D%22320%22%20cy%3D%22180%22%20r%3D%2254%22%20fill%3D%22%23fff%22%20opacity%3D%220.92%22/%3E%3Cpath%20d%3D%22M306%20150%20L306%20210%20L356%20180%20Z%22%20fill%3D%22%23ef67a8%22/%3E%3Ctext%20x%3D%22320%22%20y%3D%22285%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2C%20sans-serif%22%20font-size%3D%2224%22%20font-weight%3D%22700%22%20fill%3D%22%23c97ca8%22%3EVIDEO%20THUMBNAIL%3C/text%3E%3C/svg%3E';
  const $ = (id) => document.getElementById(id);
  let editingId = null;

  const recentThumbs = [
    {name:'루미벨 기본 썸네일', url:PLACEHOLDER_THUMB},
    {name:'마리링 합방 썸네일', url:'https://img.youtube.com/vi/PGxpbUYMGgg/hqdefault.jpg'},
    {name:'루루 클립 썸네일', url:'https://img.youtube.com/vi/5U3SPXMLjSY/hqdefault.jpg'},
    {name:'이로 직캠 썸네일', url:'https://img.youtube.com/vi/sEHQNzj_cmc/hqdefault.jpg'},
    {name:'루나 클립 썸네일', url:'https://img.youtube.com/vi/6e7rXzRpjQg/hqdefault.jpg'},
    {name:'틱톡 fallback 썸네일', url:'https://placehold.co/640x360/ffd2e5/ef67a8?text=TIKTOK'}
  ];

  function readVideos(){
    try{
      const arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      return Array.isArray(arr) ? arr : [];
    }catch(e){return []}
  }
  function writeVideos(items){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items || []));
    window.dispatchEvent(new StorageEvent('storage', {key:STORAGE_KEY, newValue:JSON.stringify(items || [])}));
  }
  function getYoutubeId(url){
    const value = String(url || '');
    const m1 = value.match(/[?&]v=([^&]+)/);
    if(m1) return m1[1];
    const m2 = value.match(/youtu\.be\/([^?&]+)/);
    if(m2) return m2[1];
    const m3 = value.match(/youtube\.com\/shorts\/([^?&/]+)/);
    if(m3) return m3[1];
    return '';
  }
  function buildYoutubeThumb(id){
    return id ? 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg' : PLACEHOLDER_THUMB;
  }
  function normalizeDate(v){
    return String(v || '').slice(0,10) || new Date().toISOString().slice(0,10);
  }
  function formatDate(v){
    return normalizeDate(v).replaceAll('-', '.');
  }
  function openModal(item){
    editingId = item && item.id ? item.id : null;
    if(item){
      $('statusInput').value = item.status || '공개';
      $('pickInput').value = item.featured ? 'ON' : 'OFF';
      $('titleInput').value = item.title || '';
      $('dateInput').value = normalizeDate(item.date);
      $('platformInput').value = String(item.platform || 'youtube').toUpperCase() === 'TIKTOK' ? 'TIKTOK' : 'YOUTUBE';
      $('memberInput').value = item.member || 'MARIRING';
      $('categoryInput').value = item.category || '방송/출연';
      $('urlInput').value = item.platform === 'tiktok' ? (item.tiktokUrl || '') : (item.youtubeUrl || (item.youtubeId ? 'https://www.youtube.com/watch?v='+item.youtubeId : ''));
      $('startInput').value = item.start || '';
      $('endInput').value = item.end || '';
      $('descInput').value = item.desc || '';
      applyThumb(item.thumb || item.thumbnailUrl || (item.youtubeId ? buildYoutubeThumb(item.youtubeId) : PLACEHOLDER_THUMB));
    }else{
      editingId = null;
      $('statusInput').value = '공개';
      $('pickInput').value = 'OFF';
      $('titleInput').value = '';
      $('dateInput').value = new Date().toISOString().slice(0,10);
      $('platformInput').value = 'YOUTUBE';
      $('memberInput').value = 'MARIRING';
      $('categoryInput').value = '방송/출연';
      $('urlInput').value = '';
      $('startInput').value = '';
      $('endInput').value = '';
      $('descInput').value = '';
      applyThumb(PLACEHOLDER_THUMB);
    }
    $('videoModal').classList.add('show');
    document.body.style.overflow = 'hidden';
    syncPreview();
  }
  function closeModal(){
    $('videoModal').classList.remove('show');
    document.body.style.overflow = '';
  }
  function applyThumb(url){
    const safe = url || PLACEHOLDER_THUMB;
    $('thumbInput').value = safe;
    $('thumbPreview').src = safe;
    $('previewImage').src = safe;
  }
  function useYoutubeThumb(){
    const id = getYoutubeId($('urlInput').value || '');
    applyThumb(buildYoutubeThumb(id));
  }
  function syncPreview(){
    $('previewTitle').textContent = $('titleInput').value || '새 영상 제목';
    $('previewDate').textContent = formatDate($('dateInput').value);
    $('previewPlatform').textContent = $('platformInput').value || 'YOUTUBE';
    $('previewMember').textContent = ($('memberInput').value || 'MARIRING') + ' · SPECIAL';
    $('previewCategory').textContent = $('categoryInput').value || '방송/출연';
    $('pickBadge').style.display = $('pickInput').value === 'ON' ? 'inline-block' : 'none';
  }
  function collectItem(asDraft){
    const platform = $('platformInput').value === 'TIKTOK' ? 'tiktok' : 'youtube';
    const url = $('urlInput').value.trim();
    const youtubeId = platform === 'youtube' ? getYoutubeId(url) : '';
    const id = editingId || ('VID-' + Date.now());
    const statusKo = asDraft ? '임시등록' : $('statusInput').value;
    return {
      id,
      platform,
      member:$('memberInput').value || 'MARIRING',
      title:$('titleInput').value.trim() || '새 영상 제목',
      date:normalizeDate($('dateInput').value),
      tag:platform === 'tiktok' ? 'TIKTOK' : 'YOUTUBE',
      event:'SPECIAL',
      category:$('categoryInput').value || '방송/출연',
      views:0,
      sparkleCount:0,
      youtubeId,
      youtubeUrl: platform === 'youtube' ? url : '',
      tiktokUrl: platform === 'tiktok' ? url : '',
      start:$('startInput').value.trim(),
      end:$('endInput').value.trim(),
      thumb:$('thumbInput').value || (youtubeId ? buildYoutubeThumb(youtubeId) : PLACEHOLDER_THUMB),
      desc:$('descInput').value.trim(),
      featured:$('pickInput').value === 'ON',
      status: statusKo,
      isPublic: statusKo === '공개',
      updatedAt:new Date().toISOString()
    };
  }
  function saveVideo(asDraft){
    const items = readVideos();
    const item = collectItem(asDraft);
    const idx = items.findIndex(v => String(v.id) === String(item.id));
    if(idx >= 0) items[idx] = {...items[idx], ...item};
    else items.unshift(item);
    writeVideos(items);
    renderRows();
    closeModal();
  }
  function setStatus(id, status){
    const items = readVideos().map(v => String(v.id) === String(id) ? {...v, status, isPublic:status==='공개', updatedAt:new Date().toISOString()} : v);
    writeVideos(items);
    renderRows();
  }
  function deleteItem(id){
    if(!confirm('이 영상을 삭제할까요?')) return;
    writeVideos(readVideos().filter(v => String(v.id) !== String(id)));
    renderRows();
  }
  function renderRows(){
    const table = $('table');
    table.querySelectorAll('.video-row').forEach(el => el.remove());
    const items = readVideos();
    $('emptyState').style.display = items.length ? 'none' : 'block';
    $('pagerText').textContent = items.length ? '1 / 1' : '0 / 0';
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'video-row';
      const status = item.status || (item.isPublic ? '공개' : '임시등록');
      const thumb = item.thumb || item.thumbnailUrl || (item.youtubeId ? buildYoutubeThumb(item.youtubeId) : PLACEHOLDER_THUMB);
      row.innerHTML =
        '<div><input type="checkbox"></div>' +
        '<div class="video-cell"><div class="video-thumb"><img src="'+thumb+'" alt=""></div><div><div class="video-title">'+escapeHtml(item.title || '')+'</div><div class="video-desc">'+escapeHtml(item.desc || '')+'</div></div></div>' +
        '<div><span class="badge">'+(item.platform === 'tiktok' ? 'TIKTOK' : 'YOUTUBE')+'</span></div>' +
        '<div><span class="badge '+(status==='공개' ? 'public' : 'draft')+'">'+status+'</span></div>' +
        '<div><span class="metric">'+escapeHtml(item.member || '')+'</span></div>' +
        '<div><span class="badge">'+escapeHtml(item.category || '')+'</span></div>' +
        '<div><span class="metric">'+formatDate(item.date)+'</span><span class="small">게시일</span></div>' +
        '<div><span class="metric">'+Number(item.views || 0)+'</span><span class="small">자동 집계</span></div>' +
        '<div><span class="metric">'+Number(item.sparkleCount || 0)+'</span><span class="small">반짝응원</span></div>' +
        '<div class="row-actions"><button class="btn-sub" data-action="edit">수정</button><button class="btn-sub" data-action="preview">미리보기</button><button class="btn-sub" data-action="toggle">'+(status==='공개'?'비공개':'공개')+'</button><button class="btn-sub warn" data-action="delete">삭제</button></div>';
      row.querySelector('[data-action="edit"]').addEventListener('click', () => openModal(item));
      row.querySelector('[data-action="preview"]').addEventListener('click', () => openModal(item));
      row.querySelector('[data-action="toggle"]').addEventListener('click', () => setStatus(item.id, status==='공개' ? '비공개' : '공개'));
      row.querySelector('[data-action="delete"]').addEventListener('click', () => deleteItem(item.id));
      table.appendChild(row);
    });
  }
  function escapeHtml(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }
  function openRecent(){
    const grid = $('recentGrid');
    grid.innerHTML = '';
    recentThumbs.forEach(item => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'recent-item';
      btn.innerHTML = '<img src="'+item.url+'" alt=""><div class="recent-name">'+escapeHtml(item.name)+'</div>';
      btn.addEventListener('click', () => {
        applyThumb(item.url);
        $('recentModal').classList.remove('show');
        $('videoModal').classList.add('show');
      });
      grid.appendChild(btn);
    });
    $('recentModal').classList.add('show');
  }

  document.querySelectorAll('.js-open-modal').forEach(btn => btn.addEventListener('click', () => openModal(null)));
  $('closeModal').addEventListener('click', closeModal);
  $('openRecent').addEventListener('click', openRecent);
  $('closeRecent').addEventListener('click', () => $('recentModal').classList.remove('show'));
  $('youtubeThumb').addEventListener('click', useYoutubeThumb);
  $('saveVideo').addEventListener('click', () => saveVideo(false));
  $('draftSave').addEventListener('click', () => saveVideo(true));
  ['titleInput','dateInput','platformInput','memberInput','categoryInput','pickInput'].forEach(id => {
    $(id).addEventListener('input', syncPreview);
    $(id).addEventListener('change', syncPreview);
  });
  $('urlInput').addEventListener('change', () => { if($('platformInput').value === 'YOUTUBE') useYoutubeThumb(); });
  $('videoModal').addEventListener('click', e => { if(e.target === $('videoModal')) closeModal(); });
  $('recentModal').addEventListener('click', e => { if(e.target === $('recentModal')) $('recentModal').classList.remove('show'); });
  document.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
  }));
  renderRows();
  syncPreview();
})();
</script>
</body>
</html>
