<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule | Lumibelle</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    .schedule-extra-wrap{margin-top:22px;text-align:center;}
    .more-schedule-btn{appearance:none;border:0;background:#f6d8e6;color:#c46d98;padding:14px 30px;border-radius:999px;font-size:17px;font-weight:800;letter-spacing:.02em;cursor:pointer;transition:transform .18s ease,background .18s ease,box-shadow .18s ease;box-shadow:0 6px 18px rgba(228,163,193,.22);}
    .more-schedule-btn:hover{background:#f3cddd;transform:translateY(-1px);}
    .calendar-section{margin-top:24px;padding:28px;background:#fff5fb;border:1px solid #f2d8e7;border-radius:26px;box-shadow:0 8px 24px rgba(232,191,211,.12);}
    .calendar-section.hidden{display:none;}
    .calendar-header{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:22px;}
    .calendar-nav-btn{width:42px;height:42px;border-radius:50%;border:1px solid #ebc4d8;background:#fff;color:#cc7ca3;font-size:24px;line-height:1;cursor:pointer;transition:background .18s ease,transform .18s ease;}
    .calendar-nav-btn:hover{background:#fff0f7;transform:translateY(-1px);}
    .calendar-month{min-width:160px;margin:0;text-align:center;font-size:24px;font-weight:900;color:#d77ca7;letter-spacing:.03em;}
    .calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
    .calendar-weekdays{margin-bottom:10px;}
    .calendar-weekdays div{text-align:center;font-size:13px;font-weight:800;color:#c99ab2;padding:6px 0;}
    .calendar-day{position:relative;min-height:108px;border:1px solid #f1dfe9;border-radius:18px;background:#fff;padding:10px 10px 14px;cursor:pointer;transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;overflow:hidden;}
    .calendar-day:hover{background:#fff1f7;transform:translateY(-1px);}
    .calendar-day.has-event:hover{background:#ffeaf4;box-shadow:0 6px 18px rgba(255,120,180,.25);}
    .calendar-day.empty{background:transparent;border:none;cursor:default;pointer-events:none;}
    .calendar-day.selected{background:#ffeef6;border-color:#e7aac7;box-shadow:0 4px 14px rgba(228,163,193,.18);}
    .calendar-day.is-important{min-height:118px;border-width:1.5px;border-color:#e6aac7;box-shadow:0 6px 18px rgba(228,163,193,.16);background:linear-gradient(180deg,#fff7fb 0%,#fff 100%);}
    .calendar-day-number{font-size:16px;font-weight:800;color:#9f7d90;margin-bottom:8px;position:relative;z-index:2;}
    .calendar-day.has-event::after{content:"";position:absolute;left:10px;bottom:10px;width:8px;height:8px;border-radius:50%;background:#ef88b5;box-shadow:0 0 0 4px rgba(239,136,181,.12);}
    .calendar-preview{display:flex;flex-direction:column;gap:5px;position:relative;z-index:2;}
    .calendar-preview-top{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
    .calendar-badge{display:inline-flex;width:fit-content;align-items:center;justify-content:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.01em;border:1px solid transparent;}
    .badge-live{background:#ffe7f1;color:#de77a7;border-color:#f3bfd5;}
    .badge-event{background:#eef7ff;color:#6f9bcf;border-color:#c9dff9;}
    .badge-debut{background:#f4ebff;color:#9f74d1;border-color:#dcc8fa;box-shadow:0 0 10px rgba(160,120,255,.4);}
    .badge-oneman{background:#fff0f1;color:#de6c88;border-color:#f5c1cc;}
    .badge-new{background:#ff4fa3;color:#fff;border-color:#ff4fa3;}
    .calendar-preview-title{font-size:11px;line-height:1.35;color:#b1849c;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .calendar-preview-title.is-important-title{font-size:12px;font-weight:800;color:#9d6f87;}
    .schedule-detail{margin-top:24px;padding:22px;border-radius:22px;background:#fff;border:1px solid #f2dbe7;}
    .detail-empty{margin:0;text-align:center;font-size:15px;color:#b291a4;}
    .detail-date{margin-bottom:16px;font-size:20px;font-weight:900;color:#d77ca7;letter-spacing:.02em;}
    .detail-item{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid #f6e7ef;}
    .detail-item:last-child{border-bottom:none;padding-bottom:0;}
    .detail-left{display:flex;flex-direction:column;gap:7px;}
    .detail-topline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .detail-place{font-size:14px;color:#b28ea2;}.detail-event{font-size:18px;font-weight:800;color:#8f7183;}
    .detail-buttons{display:flex;gap:10px;flex-wrap:wrap;}
    .detail-ticket{display:inline-flex;align-items:center;justify-content:center;min-width:96px;padding:10px 16px;border-radius:999px;border:1px solid #efbfd4;background:#fff8fc;color:#e27aa9;text-decoration:none;font-size:14px;font-weight:800;transition:background .18s ease,transform .18s ease;}
    .detail-ticket:hover{background:#fff0f7;transform:translateY(-1px);}.detail-button-muted{opacity:.65;cursor:default;pointer-events:none;}.detail-button-detail{background:#f4f0ff;color:#8d70d5;border-color:#d7caf6;}.detail-button-detail:hover{background:#eee8ff;}
    @media (max-width:900px){.calendar-section{padding:18px;}.calendar-month{min-width:120px;font-size:20px;}.calendar-grid,.calendar-weekdays{gap:6px;}.calendar-day{min-height:92px;border-radius:14px;padding:8px 8px 12px;}.calendar-day.is-important{min-height:98px;}.calendar-day-number{font-size:14px;}.calendar-preview-title{font-size:10px;}.calendar-preview-title.is-important-title{font-size:11px;}.calendar-badge{font-size:10px;padding:3px 7px;}.detail-item{flex-direction:column;align-items:flex-start;}.detail-ticket{min-width:0;}}
    @media (max-width:640px){.calendar-section{overflow-x:auto;}.calendar-weekdays,.calendar-grid{min-width:650px;}}
  </style>

  <style>
    /* ===== index.html 기준 공통 상단/효과 CSS ===== */
    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fffafc;
    }

    main.page-shell {
      flex: 1;
    }

    .top-lang-bar{
      width:100%;
      max-width:1260px;
      margin:16px auto 0;
      display:flex;
      justify-content:flex-end;
      padding:0 34px 0 18px;
      box-sizing:border-box;
    }

    /* ===== 상단 1차 메뉴 ===== */
    nav{
      display:grid;
      grid-template-columns:repeat(8, minmax(0, 1fr));
      gap:18px;
      text-align:center;
      align-items:center;
      flex:1;
      margin:0 20px;
    }

    nav a{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-width:0;
    }

    nav a b,
    nav a span{
      display:block;
      width:100%;
      text-align:center;
      white-space:nowrap;
    }

    nav a b{
      font-size:1.18em;
    }

    nav a span{
      margin-top:2px;
    }

    .header-box{
      display:flex;
      align-items:center;
      gap:24px;
    }

    /* ===== 언어 버튼 ===== */
    .lang-switch{
      display:flex;
      align-items:center;
      gap:10px;
      flex:0 0 auto;
      padding-right:2px;
    }

    .lang-switch a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:42px;
      height:36px;
      padding:0 10px;
      border-radius:999px;
      background:#fff;
      border:1px solid #f0bfd4;
      color:#d27ca8;
      text-decoration:none;
      font-size:12px;
      font-weight:900;
      transition:background .18s ease, color .18s ease, box-shadow .18s ease;
      box-shadow:0 4px 10px rgba(255,95,165,0.08);
    }

    .lang-switch a:hover,
    .lang-switch a.active{
      background:#fff0f7;
      color:#ff59a5;
      transform:translateY(-1px);
    }

    nav a{
      position:relative;
      border-radius:22px;
      overflow:visible;
      transform:none !important;
    }

    nav a.current,
    nav a:hover,
    nav a:focus,
    nav a:focus-visible,
    nav a:active{
      background:transparent !important;
      box-shadow:none !important;
      z-index:1;
      outline:none !important;
      transform:none !important;
    }

    nav a.current::before,
    nav a:hover::before,
    nav a:focus::before,
    nav a:focus-visible::before{
      content:"";
      position:absolute;
      top:0;
      bottom:0;
      left:0;
      right:0;
      border-radius:22px;
      background:linear-gradient(90deg,
        rgba(255,217,232,0.00) 0%,
        rgba(255,217,232,0.18) 16%,
        rgba(255,192,215,0.20) 36%,
        rgba(255,192,215,0.24) 50%,
        rgba(255,192,215,0.20) 64%,
        rgba(255,217,232,0.18) 84%,
        rgba(255,217,232,0.00) 100%);
      z-index:-1;
      pointer-events:none;
      box-shadow:0 4px 10px rgba(255,192,215,0.05);
    }

    nav a.current b,
    nav a:hover b{
      color:#ff59a5;
    }

    nav a.current span,
    nav a:hover span{
      color:#d88dad;
    }


    /* ===== 상단 2차 메뉴 ===== */
    .subnav-wrap{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:18px;
      margin:18px auto 8px;
      max-width:1260px;
    }

    .subnav-card{
      position:relative;
      padding:24px 30px;
      border-radius:24px;
      background:#fff5fb;
      border:1px solid #f2d8e7;
      box-shadow:0 8px 24px rgba(232, 191, 211, 0.12);
      text-decoration:none;
      text-align:center;
      transition:transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      overflow:hidden;
    }

    .subnav-card:hover{
      transform:translateY(-3px);
      box-shadow:0 14px 30px rgba(232,191,211,0.18);
      background:#fff0f7;
    }

    .subnav-card:focus,
    .subnav-card:focus-visible,
    .subnav-card:active,
    .live-guide-card:focus,
    .live-guide-card:focus-visible,
    .live-guide-card:active{
      transform:none !important;
      outline:none !important;
    }

    nav a:focus,
    nav a:active,
    .subnav-card:focus,
    .subnav-card:active{
      outline:none !important;
      transform:none !important;
      box-shadow:0 8px 24px rgba(232, 191, 211, 0.12) !important;
    }

    nav a,
    .subnav-card{
      -webkit-tap-highlight-color:transparent;
    }

    .subnav-card h3{
      margin:0 0 8px;
      color:#ff59a5;
      font-size:21px;
      font-weight:900;
      line-height:1;
      letter-spacing:0.02em;
    }

    .subnav-card p{
      margin:0;
      color:#b28ea2;
      font-size:15px;
      font-weight:800;
      line-height:1.3;
    }

    .coming-badge{
      position:absolute;
      top:10px;
      right:10px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:5px 9px;
      border-radius:999px;
      background:#ff59a5;
      color:#fff;
      font-size:10px;
      font-weight:900;
      letter-spacing:0.04em;
      line-height:1;
      box-shadow:0 6px 14px rgba(255,89,165,0.22);
    }

    /* ===== 위로가기 버튼 : 마법구슬 버전 ===== */
    .back-to-top{
      position:fixed;
      right:22px;
      bottom:22px;
      width:64px;
      height:64px;
      border:none;
      border-radius:50%;
      background:linear-gradient(180deg,#ff86bb 0%,#ff5fa5 54%,#caa7ff 100%);
      color:#fff;
      cursor:pointer;
      box-shadow:
        0 14px 28px rgba(255,95,165,.28),
        0 0 0 6px rgba(255,255,255,.58),
        0 0 24px rgba(202,167,255,.18);
      z-index:1200;
      opacity:0;
      visibility:hidden;
      transform:translateY(10px) scale(.94);
      transition:opacity .2s ease, visibility .2s ease, transform .2s ease, filter .2s ease;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      font-family:"SUIT","Noto Sans KR",sans-serif;
      -webkit-tap-highlight-color:transparent;
    }

    .back-to-top.show{
      opacity:1;
      visibility:visible;
      transform:translateY(0) scale(1);
    }

    .back-to-top:hover{
      filter:brightness(1.04);
      transform:translateY(-3px) scale(1.03);
    }

    .back-to-top::before{
      content:"";
      position:absolute;
      inset:-70%;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.75), transparent 16%),
        radial-gradient(circle at 68% 62%, rgba(255,255,255,.34), transparent 18%),
        conic-gradient(from 0deg, transparent, rgba(255,255,255,.42), transparent, rgba(255,255,255,.28), transparent);
      animation:lumiTopSpin 5s linear infinite;
      pointer-events:none;
    }

    .back-to-top::after{
      content:"✦";
      position:absolute;
      right:10px;
      top:8px;
      color:rgba(255,255,255,.78);
      font-size:14px;
      animation:lumiTopStar 1.8s ease-in-out infinite;
      pointer-events:none;
    }

    .back-to-top .top-arrow,
    .back-to-top .top-label{
      position:relative;
      z-index:1;
      line-height:1;
      font-style:normal;
      text-shadow:0 2px 8px rgba(148,64,112,.18);
    }

    .back-to-top .top-arrow{
      font-size:25px;
      font-weight:900;
      margin-top:1px;
    }

    .back-to-top .top-label{
      margin-top:4px;
      font-size:10px;
      font-weight:900;
      letter-spacing:.08em;
    }

    @keyframes lumiTopSpin{
      to{transform:rotate(360deg);}
    }

    @keyframes lumiTopStar{
      0%,100%{transform:translateY(0) rotate(0deg);opacity:.58;}
      50%{transform:translateY(-3px) rotate(12deg);opacity:1;}
    }

    @media (max-width:780px){
      .back-to-top{
        right:16px;
        bottom:16px;
        width:58px;
        height:58px;
      }
      .back-to-top .top-arrow{
        font-size:23px;
      }
      .back-to-top .top-label{
        font-size:9px;
      }
    }

    /* ===== 상단 메인 비주얼 (최종 통합본) ===== */
    .hero-banner {
      position: relative;
      margin-top: 8px;
      border: 1px solid #f2d8e7;
      border-radius: 32px;
      overflow: hidden;
      min-height: 560px;
      box-shadow: 0 8px 24px rgba(232, 191, 211, 0.12);
      background: #fdf2f7; 
    }

    .hero-banner .slide{
      z-index:1;
    }

    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
      z-index: 1;
    }

    .slide.active {
      opacity: 1;
      z-index: 1;
    }

    .hero-inner {
      position: relative;
      z-index: 2; 
      padding: 86px 56px 96px;
      max-width: 720px;
    }

    .hero-kor {
      font-size: 18px;
      font-weight: 800;
      color: #f35aa0;
      margin-bottom: 5px;
    }

    .hero-logo {
      font-size: 80px;
      font-weight: 900;
      color: #f5539f;
      line-height: 1;
      margin: 10px 0;
      text-shadow: 2px 2px 0px #fff;
    }

    .hero-sub {
      font-size: 24px;
      font-weight: 800;
      color: #f35aa0;
    }

    .hero-desc {
      font-size: 16px;
      line-height: 1.8;
      font-weight: 700;
      color: #555;
      margin-top: 25px;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.9);
    }

    /* ===== 섹션 공통 ===== */
    .section-heading {
      text-align: center;
      margin: 38px 0 20px;
    }

    .section-heading h2 {
      margin: 0;
      color: #d77ca7;
      font-size: 62px;
      line-height: 1;
      font-weight: 900;
    }

    .section-heading p {
      margin: 10px 0 0;
      color: #c99ab2;
      font-size: 18px;
      font-weight: 700;
    }

    /* ===== 멤버 ===== */
    .member-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    .member-card {
      background: #fff5fb;
      border: 1px solid #f2d8e7;
      border-radius: 28px;
      padding: 10px 10px 16px;
      box-shadow: 0 8px 24px rgba(232, 191, 211, 0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .member-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 32px rgba(0,0,0,0.12);
    }

    .member-card.mariring {
      background: #fff0f6;
    }

    .member-card.lulu {
      background: #fff6f9;
    }

    .member-card.iro {
      background: #f4faff;
    }

    .member-card.lunar {
      background: #f7f2ff;
    }

    .member-name-bar {
      border-radius: 0 0 999px 999px;
      color: #fff;
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      padding: 14px 10px;
      margin-bottom: 12px;
      letter-spacing: 0.08em;
    }

    .member-card.mariring .member-name-bar {
      background: #ff59a5;
      box-shadow: 0 6px 16px rgba(255, 89, 165, 0.25);
    }

    .member-card.lulu .member-name-bar {
      background: linear-gradient(180deg, #FFB8D3 0%, #FFD9E8 100%);
      box-shadow: 0 6px 16px rgba(255, 184, 211, 0.30);
    }

    .member-card.iro .member-name-bar {
      background: #8ECDF2;
      box-shadow: 0 6px 16px rgba(142, 205, 242, 0.30);
    }

    .member-card.lunar .member-name-bar {
      background: #9F6DE0;
      box-shadow: 0 6px 16px rgba(159, 109, 224, 0.30);
    }

    .mariring { background: #f35aa0; }
    .lulu { background: linear-gradient(180deg, #FFC0D7 0%, #FFD9E8 100%); }
    .iro { background: #B2DEFF; }

    .member-photo {
      width: 100%;
      height: 360px;
      background: #fff;
      border: 1px solid #f0dde8;
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .member-photo picture{
      display:block;
      width:100%;
      height:100%;
    }

    .member-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .member-color-text {
      text-align: center;
      color: #b28ea2;
      line-height: 1.8;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .member-meta {
      color: #8f7183;
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 18px;
      text-align:left;
      padding:0 16px 0 18px;
    }

    .member-meta div{
      margin-bottom: 12px;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    .member-meta strong {
      display:inline;
      color: #b28ea2;
      margin-right: 8px;
      margin-bottom: 0;
      font-weight: 800;
    }

    .member-btn {
      display: inline-flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      padding: 14px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 900;
      color: #fff;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    .member-btn.mariring { background: #f35aa0; }
    .member-btn.lulu { background: linear-gradient(180deg, #FFC0D7 0%, #FFD9E8 100%); }
    .member-btn.iro { background: #B2DEFF; }
    .member-btn.lunar { background: #ba8ce7; }

    .member-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    /* ===== SETLIST 바로가기 카드 ===== */
    .live-guide-shortcut{
      margin-top: 52px;
      margin-bottom: 28px;
      margin-bottom: 4px;
    }

    .live-guide-card{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      width:100%;
      padding:32px 34px;
      border-radius:28px;
      border:1px solid #f2d8e7;
      background:linear-gradient(135deg, #fff0f7 0%, #f3ebff 100%);
      box-shadow:0 8px 24px rgba(232,191,211,0.12);
      text-decoration:none;
      transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
      position:relative;
      overflow:hidden;
    }

    .live-guide-card::after{
      content:"";
      position:absolute;
      top:-20%;
      left:-30%;
      width:180px;
      height:180px;
      background:radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 70%);
      pointer-events:none;
    }

    .live-guide-card:hover{
      transform:translateY(-3px);
      box-shadow:0 14px 30px rgba(232,191,211,0.18);
      background:linear-gradient(135deg, #ffe8f3 0%, #efe5ff 100%);
    }

    .live-guide-text strong{
      display:block;
      margin-bottom:8px;
      color:#ff59a5;
      font-size:32px;
      font-weight:900;
      line-height:1;
    }

    .live-guide-text span{
      display:block;
      color:#8f7183;
      font-size:17px;
      font-weight:700;

    /* ===== reveal animation (조금 더 보이게) ===== */
    .reveal{
      opacity:0;
      transform:translateY(30px);
      transition:opacity .85s ease, transform .85s ease;
      will-change:opacity, transform;
    }

    .reveal.show{
      opacity:1;
      transform:translateY(0);

    /* ===== 메뉴/버튼 스윕 효과 ===== */
    nav a,
    .subnav-card,
    .live-guide-card,
    .member-btn,
    .more-btn,
    .info-link-btn,
    .ticket-btn{
      position:relative;
      overflow:hidden;
      isolation:isolate;
    }

    nav a::after,
    .subnav-card::after,
    .live-guide-card::before,
    .member-btn::after,
    .more-btn::after,
    .info-link-btn::after,
    .ticket-btn::after{
      content:"";
      position:absolute;
      top:-35%;
      left:-42%;
      width:22%;
      height:170%;
      background:linear-gradient(
        90deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,.12) 35%,
        rgba(255,255,255,.28) 50%,
        rgba(255,255,255,.12) 65%,
        rgba(255,255,255,0) 100%
      );
      transform:skewX(-22deg) translateX(0);
      opacity:0;
      pointer-events:none;
      z-index:2;
    }

    nav a:hover::after,
    .subnav-card:hover::after,
    .live-guide-card:hover::before,
    .member-btn:hover::after,
    .more-btn:hover::after,
    .info-link-btn:hover::after,
    .ticket-btn:hover::after{
      animation:sweepShine .9s ease forwards;
    }

    @keyframes sweepShine{
      0%{
        opacity:0;
        transform:skewX(-22deg) translateX(0);
      }
      15%{
        opacity:1;
      }
      100%{
        opacity:0;
        transform:skewX(-22deg) translateX(560%);
      }
    }

    .click-shine::after{
      animation:sweepShine .9s ease forwards;
    }


    /* ===== 멤버 카드 hover 강화 + 하얀 선 1회만 ===== */
    .member-card{
      position:relative;
      overflow:hidden;
      isolation:isolate;
    }

    .member-card::after{
      content:"";
      position:absolute;
      top:-20%;
      left:-38%;
      width:24%;
      height:140%;
      background:linear-gradient(
        90deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.16) 35%,
        rgba(255,255,255,0.40) 50%,
        rgba(255,255,255,0.16) 65%,
        rgba(255,255,255,0) 100%
      );
      transform:skewX(-24deg) translateX(0);
      opacity:0;
      pointer-events:none;
      z-index:2;
      will-change:transform, opacity;
    }

    .member-card.shine-once::after{
      animation:memberShine .95s ease forwards;
    }

    @keyframes memberShine{
      0%{
        opacity:0;
        transform:skewX(-24deg) translateX(0);
      }
      10%{
        opacity:1;
      }
      100%{
        opacity:0;
        transform:skewX(-24deg) translateX(620%);
      }
    }

/* ===== 기본 글리터 클릭 효과 ===== */
.glitter-burst{
  position:fixed;
  pointer-events:none;
  width:8px;
  height:8px;
  background:radial-gradient(circle, #fff 0%, #ffc0d7 60%, transparent 100%);
  border-radius:50%;
  opacity:0;
  animation:glitterPop 0.8s ease-out forwards;
}

@keyframes glitterPop{
  0%{
    transform:translate(0,0) scale(0.5);
    opacity:1;
  }
  100%{
    transform:translate(var(--x), var(--y)) scale(1.2);
    opacity:0;
  }
}


/* ===== 클릭 뿅 효과 ===== */
.burst-spark,
.burst-petal{
  position:fixed;
  pointer-events:none;
  left:0;
  top:0;
  z-index:5000;
  opacity:0;
}

.burst-spark{
  width:16px;
  height:16px;
  animation:burstSpark .72s ease-out forwards;
}

.burst-spark::before,
.burst-spark::after{
  content:"";
  position:absolute;
  background:#fff;
  border-radius:999px;
  box-shadow:0 0 10px rgba(255,255,255,.9), 0 0 18px rgba(255,192,215,.7);
}

.burst-spark::before{
  width:3px;
  height:16px;
  left:6.5px;
  top:0;
}

.burst-spark::after{
  width:16px;
  height:3px;
  left:0;
  top:6.5px;
}

.burst-petal{
  width:14px;
  height:14px;
  border-radius:999px;
  background:radial-gradient(circle at 35% 35%, #fff 0%, #ffd9e8 42%, #ffc0d7 78%, rgba(255,192,215,0) 100%);
  box-shadow:0 0 10px rgba(255,192,215,.55);
  animation:burstPetal .78s ease-out forwards;
}

@keyframes burstSpark{
  0%{
    transform:translate(0,0) scale(.45) rotate(0deg);
    opacity:1;
  }
  100%{
    transform:translate(var(--x), var(--y)) scale(1.15) rotate(90deg);
    opacity:0;
  }
}

@keyframes burstPetal{
  0%{
    transform:translate(0,0) scale(.6);
    opacity:1;
  }
  100%{
    transform:translate(var(--x), var(--y)) scale(1.2);
    opacity:0;
  }
}

  <main class="page-shell"><div class="wrap">
    <div class="page-title reveal"><h2>SCHEDULE</h2><p>스케줄</p></div>
    <div class="box schedule-list-page reveal"><div class="row schedule-row"><div>2026.07.12(일)</div><div>KT&amp;G 상상마당 라이브홀</div><div>루미벨 데뷔라이브</div><a class="ticket" href="ticket/current.html">TICKET</a></div></div>
    <div class="schedule-extra-wrap reveal"><button id="toggleCalendar" class="more-schedule-btn" type="button">MORE SCHEDULE</button></div>
    <div id="calendarSection" class="calendar-section hidden"><div class="calendar-header"><button id="prevMonth" class="calendar-nav-btn" type="button" aria-label="이전 달">‹</button><h3 id="calendarMonth" class="calendar-month"></h3><button id="nextMonth" class="calendar-nav-btn" type="button" aria-label="다음 달">›</button></div><div class="calendar-weekdays"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div></div><div id="calendarGrid" class="calendar-grid"></div><div id="scheduleDetail" class="schedule-detail"><p class="detail-empty">날짜를 선택하면 상세 일정이 보여집니다.</p></div></div>

  <script>
    const events={"2026-07-12":[{type:"DEBUT",place:"KT&G 상상마당 라이브홀",event:"루미벨 데뷔라이브",ticket:"ticket/current.html",detail:"ticket/current.html",isNew:true}],"2026-10-18":[{type:"LIVE",place:"미정",event:"라이브 예정",ticket:"",detail:"",isNew:false}]};
    const toggleBtn=document.getElementById("toggleCalendar"),calendarSection=document.getElementById("calendarSection"),calendarGrid=document.getElementById("calendarGrid"),calendarMonth=document.getElementById("calendarMonth"),scheduleDetail=document.getElementById("scheduleDetail"),prevMonthBtn=document.getElementById("prevMonth"),nextMonthBtn=document.getElementById("nextMonth");
    let currentDate=new Date(2026,6,1);
    toggleBtn.addEventListener("click",()=>{calendarSection.classList.toggle("hidden");if(!calendarSection.classList.contains("hidden")){toggleBtn.textContent="CLOSE";renderCalendar();}else{toggleBtn.textContent="MORE SCHEDULE";scheduleDetail.innerHTML='<p class="detail-empty">날짜를 선택하면 상세 일정이 보여집니다.</p>';}});
    prevMonthBtn.addEventListener("click",()=>{currentDate=new Date(currentDate.getFullYear(),currentDate.getMonth()-1,1);renderCalendar();});
    nextMonthBtn.addEventListener("click",()=>{currentDate=new Date(currentDate.getFullYear(),currentDate.getMonth()+1,1);renderCalendar();});
    function getBadgeInfo(type){switch(type){case"ONEMAN":return{label:"ONEMAN",className:"badge-oneman",important:true};case"DEBUT":return{label:"DEBUT",className:"badge-debut",important:true};case"EVENT":return{label:"EVENT",className:"badge-event",important:false};default:return{label:"LIVE",className:"badge-live",important:false};}}
    function renderCalendar(){calendarGrid.innerHTML="";scheduleDetail.innerHTML='<p class="detail-empty">날짜를 선택하면 상세 일정이 보여집니다.</p>';const year=currentDate.getFullYear(),month=currentDate.getMonth();calendarMonth.textContent=`${year}.${String(month+1).padStart(2,"0")}`;const firstDay=new Date(year,month,1).getDay(),lastDate=new Date(year,month+1,0).getDate(),today=new Date();for(let i=0;i<firstDay;i++){const emptyCell=document.createElement("div");emptyCell.className="calendar-day empty";calendarGrid.appendChild(emptyCell);}for(let day=1;day<=lastDate;day++){const dateKey=`${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`,dayCell=document.createElement("div");dayCell.className="calendar-day";if(year===today.getFullYear()&&month===today.getMonth()&&day===today.getDate())dayCell.style.border="2px solid #ff4fa3";const eventList=events[dateKey];let previewHTML="";if(eventList&&eventList.length>0){dayCell.classList.add("has-event");const firstEvent=eventList[0],badgeInfo=getBadgeInfo(firstEvent.type);if(badgeInfo.important)dayCell.classList.add("is-important");previewHTML=`<div class="calendar-preview"><div class="calendar-preview-top"><span class="calendar-badge ${badgeInfo.className}">${badgeInfo.label}</span>${firstEvent.isNew?`<span class="calendar-badge badge-new">NEW</span>`:``}</div><div class="calendar-preview-title ${badgeInfo.important?"is-important-title":""}">${firstEvent.event}</div></div>`;}dayCell.innerHTML=`<div class="calendar-day-number">${day}</div>${previewHTML}`;dayCell.addEventListener("click",()=>{document.querySelectorAll(".calendar-day").forEach(cell=>cell.classList.remove("selected"));dayCell.classList.add("selected");renderDetail(dateKey);});calendarGrid.appendChild(dayCell);}}
    function renderDetail(dateKey){const eventList=events[dateKey];if(!eventList){scheduleDetail.innerHTML='<p class="detail-empty">해당 날짜에는 등록된 일정이 없습니다.</p>';return;}const [year,month,day]=dateKey.split("-"),formattedDate=`${year}.${month}.${day}`;scheduleDetail.innerHTML=`<div class="detail-date">${formattedDate}</div>${eventList.map(item=>{const badgeInfo=getBadgeInfo(item.type);return`<div class="detail-item"><div class="detail-left"><div class="detail-topline"><span class="calendar-badge ${badgeInfo.className}">${badgeInfo.label}</span>${item.isNew?`<span class="calendar-badge badge-new">NEW</span>`:``}<span class="detail-place">${item.place}</span></div><span class="detail-event">${item.event}</span></div><div class="detail-buttons">${item.ticket?`<a href="${item.ticket}" class="detail-ticket">TICKET</a>`:`<span class="detail-ticket detail-button-muted">추후 안내</span>`}${item.detail?`<a href="${item.detail}" class="detail-ticket detail-button-detail">DETAIL</a>`:``}</div></div>`;}).join("")}`;}
    const revealEls=document.querySelectorAll('.reveal');if('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('show');observer.unobserve(entry.target);}});},{threshold:.12});revealEls.forEach(el=>observer.observe(el));}else{revealEls.forEach(el=>el.classList.add('show'));}
  </script>

  <script>
    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 280) {
        backToTop.classList.add('show');
      } else {
        backToTop.classList.remove('show');
      }
    });
    backToTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
  </script>

<script>
    function createLumibelleCursorMagic(x, y){
      // 1) 먼저 둥근 빛 고리부터 크게 퍼지게
      const ring = document.createElement('span');
      ring.className = 'lumi-magic-ring';
      ring.style.left = x + 'px';
      ring.style.top = y + 'px';
      document.body.appendChild(ring);
      setTimeout(() => ring.remove(), 980);

      // 2) 별빛은 점 덩어리처럼 보이지 않게 6개만, 십자 별로 퍼짐
      const starCount = 8;
      for(let i=0; i<starCount; i++){
        const star = document.createElement('span');
        star.className = 'lumi-magic-star';
        const angle = (Math.PI * 2 * i) / starCount + (Math.random() * .35 - .18);
        const distance = 28 + Math.random() * 34;
        star.style.left = x + 'px';
        star.style.top = y + 'px';
        star.style.setProperty('--x', Math.cos(angle) * distance + 'px');
        star.style.setProperty('--y', Math.sin(angle) * distance + 'px');
        star.style.setProperty('--r', (Math.random() * 120 - 60) + 'deg');
        document.body.appendChild(star);
        setTimeout(() => star.remove(), 900);
      }

      // 3) 나비는 2~3개만 위/옆으로 날아가게
      const butterflyCount = 2;
      for(let i=0; i<butterflyCount; i++){
        const butterfly = document.createElement('span');
        butterfly.className = 'lumi-magic-butterfly';
        const angle = -Math.PI / 2 + (i - 1) * .42 + (Math.random() * .22 - .11);
        const distance = 54 + Math.random() * 38;
        butterfly.style.left = x + 'px';
        butterfly.style.top = y + 'px';
        butterfly.style.setProperty('--x', Math.cos(angle) * distance + 'px');
        butterfly.style.setProperty('--y', Math.sin(angle) * distance + 'px');
        butterfly.style.setProperty('--r', (Math.random() * 54 - 27) + 'deg');
        document.body.appendChild(butterfly);
        setTimeout(() => butterfly.remove(), 1050);
      }
    }

    // click magic is now handled globally below, including empty spaces.
  </script>

<script>
    // 루미벨 커서 최종 효과: 허공 클릭 / 마우스 잔광 / hover 상태
    (() => {
      const canUseMagicCursor = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
      if(!canUseMagicCursor) return;

      const glow = document.createElement('span');
      glow.className = 'lumi-cursor-glow';
      document.body.appendChild(glow);

      const core = document.createElement('span');
      core.className = 'lumi-cursor-core';
      document.body.appendChild(core);

      let lastTrail = 0;
      let lastX = 0;
      let lastY = 0;

      function moveCursor(x, y){
        lastX = x;
        lastY = y;
        glow.style.left = x + 'px';
        glow.style.top = y + 'px';
        core.style.left = x + 'px';
        core.style.top = y + 'px';
      }

      function createTrailSpark(x, y){
        const spark = document.createElement('span');
        spark.className = 'lumi-trail-spark';
        spark.style.left = x + 'px';
        spark.style.top = y + 'px';
        spark.style.setProperty('--x', (Math.random() * 34 - 17) + 'px');
        spark.style.setProperty('--y', (-16 - Math.random() * 28) + 'px');
        document.body.appendChild(spark);
        setTimeout(() => spark.remove(), 1000);
      }

      document.addEventListener('pointermove', (event) => {
        moveCursor(event.clientX, event.clientY);
        const now = performance.now();
        if(now - lastTrail > 58){
          lastTrail = now;
          createTrailSpark(event.clientX, event.clientY);
        }
      }, { passive:true });

      document.addEventListener('pointerover', (event) => {
        if(event.target.closest('a, button, .ticket-option, .meate-option, .package-btn, .quick-icon-btn, .reserve-btn, .top-button, .back-to-top, .lang-switch a, nav a, .subnav-card, .live-guide-card, .member-card, .member-btn, .more-btn, .info-link-btn, .ticket-btn, .sns-icon, .news-item, .schedule-item')){
          document.body.classList.add('lumi-cursor-hover');
        }
      });

      document.addEventListener('pointerout', (event) => {
        if(event.target.closest('a, button, .ticket-option, .meate-option, .package-btn, .quick-icon-btn, .reserve-btn, .top-button, .back-to-top, .lang-switch a, nav a, .subnav-card, .live-guide-card, .member-card, .member-btn, .more-btn, .info-link-btn, .ticket-btn, .sns-icon, .news-item, .schedule-item')){
          document.body.classList.remove('lumi-cursor-hover');
        }
      });

      document.addEventListener('click', (event) => {
        // 클릭 가능한 곳뿐 아니라 허공 클릭도 전부 마법 효과 발생
        createLumibelleCursorMagic(event.clientX, event.clientY);
      });

      document.addEventListener('mouseleave', () => {
        glow.style.opacity = '0';
        core.style.opacity = '0';
      });

      document.addEventListener('mouseenter', () => {
        glow.style.opacity = '';
        core.style.opacity = '';
        moveCursor(lastX, lastY);
      });
    })();
  </script>
