<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MORE VIDEO | Lumibelle</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=SUIT:wght@400;600;700;800;900&display=swap');
  *{box-sizing:border-box} html,body{margin:0;padding:0} body{min-height:100vh;background:#fffafc;color:#7f6a77;font-family:"SUIT","Noto Sans KR",sans-serif;display:flex;align-items:center;justify-content:center;padding:28px;}
  .card{width:min(720px,100%);border:1px solid #f2d8e7;border-radius:34px;background:linear-gradient(135deg,#fff5fb 0%,#f7f0ff 100%);box-shadow:0 18px 44px rgba(232,191,211,.22);padding:54px 38px;text-align:center;position:relative;overflow:hidden;}
  .card:before{content:"";position:absolute;inset:-45% -20% auto auto;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,138,194,.20) 45%,transparent 72%);}
  .eyebrow{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid #f0bfd4;color:#d77ca7;font-size:12px;font-weight:900;letter-spacing:.08em;}
  h1{margin:22px 0 12px;font-family:"Cormorant Garamond",serif;font-size:58px;line-height:.95;color:#ff5aa6;text-shadow:0 2px 0 #fff;}
  h2{margin:0;color:#d77ca7;font-size:24px;font-weight:900;}
  p{margin:18px auto 0;max-width:520px;color:#8f7183;font-size:16px;font-weight:700;line-height:1.8;}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px;}
  a{display:inline-flex;align-items:center;justify-content:center;min-width:160px;padding:14px 20px;border-radius:999px;text-decoration:none;font-size:15px;font-weight:900;}
  .primary{background:linear-gradient(180deg,#ff7eb3 0%,#ff5fa5 100%);color:#fff;box-shadow:0 8px 18px rgba(255,95,165,.22)}
  .secondary{background:#fff;color:#d27ca8;border:1px solid #f0bfd4;}
  .note{margin-top:24px;color:#c99ab2;font-size:13px;font-weight:800;}
  @media(max-width:680px){.card{padding:42px 22px;border-radius:28px} h1{font-size:44px} h2{font-size:20px} p{font-size:14px}.actions{flex-direction:column}a{width:100%}}
</style>
</head>
<body>
  <main class="card">
    <span class="eyebrow">LUMIBELLE OFFICIAL</span>
    <h1>MORE VIDEO</h1>
    <h2>영상 아카이브 준비 중입니다</h2>
    <p>이 페이지는 공개 전 정리 중입니다.<br>티켓 예매와 필수 안내는 현재 공개된 메뉴에서 먼저 확인해 주세요.</p>
    <div class="actions">
      <a class="primary" href="index.html">HOME으로 돌아가기</a>
      <a class="secondary" href="ticket/">TICKET 보기</a>
    </div>
    <div class="note">공개 일정과 구성은 운영 상황에 따라 변경될 수 있습니다.</div>
  </main>
</body>
</html>
