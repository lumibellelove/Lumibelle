<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LUMI PHONE V2</title>
  <link rel="stylesheet" href="css/lumiphone.css" />
  <link rel="stylesheet" href="css/apps/placeholder-apps.css" />
  <link rel="stylesheet" href="css/apps/booth.css" />
  <link rel="stylesheet" href="css/apps/memo.css" />
  <link rel="stylesheet" href="css/apps/gate.css" />
  <link rel="stylesheet" href="css/apps/point.css" />
  <link rel="stylesheet" href="css/apps/point-adjust.css" />
  <link rel="stylesheet" href="css/apps/homework-cheki.css" />
  <link rel="stylesheet" href="css/apps/caution.css" />
  <link rel="stylesheet" href="css/apps/notification.css" />
  <link rel="stylesheet" href="css/apps/cheki.css" />
  <link rel="stylesheet" href="css/apps/timer.css" />
  <link rel="stylesheet" href="css/apps/queue.css?v=39" />
  <link rel="stylesheet" href="css/apps/fan-check.css" />
  <link rel="stylesheet" href="css/apps/attendance.css" />
  <link rel="stylesheet" href="css/staff-bridge.css" />
</head>
<body>
  <main class="phone-stage">
    <section class="phone-shell" aria-label="LUMI PHONE V2">
      <div class="phone-screen">
        <div class="screens" data-role="screens">
          <section class="screen-page home-page" data-page="home-main" aria-label="Staff Home">
            <header class="home-header">
              <div>
                <span class="home-kicker">LUMIBELLE STAFF</span>
                <strong>Staff OS</strong>
              </div>
              <div class="home-header-actions">
                <button type="button" data-dock-app="profile" aria-label="MY">MY</button>
                <button type="button" class="home-notification-button" data-dock-app="caution" aria-label="알림센터"><span aria-hidden="true">알림</span><b data-notification-badge>3</b></button>
              </div>
            </header>

            <button type="button" class="today-event-card" data-dock-app="gate" aria-label="오늘 공연 보기">
              <div class="event-poster-slot" aria-hidden="true"><span>LIVE</span></div>
              <div class="event-copy">
                <span class="event-chip" data-role="reservation-status">입장 준비 중</span>
                <strong data-role="reservation-title">루미벨 데뷔 라이브</strong>
                <p data-role="reservation-date">OPEN 17:30 · START 18:00</p>
                <p data-role="reservation-meta">KT&amp;G 상상마당</p>
                <p class="event-weather"><span data-role="weather-temp">21°C</span> · <span data-role="weather-desc">공연장 날씨 기준</span></p>
              </div>
            </button>

            <section class="summary-grid" data-role="today-summary" aria-label="오늘 현황"></section>

            <article class="queue-home-card">
              <div class="queue-home-content">
                <div class="queue-card-head"><strong>특전회 운영</strong></div>
                <p><b data-role="queue-home-title">현재 준비 중이에요!</b><span data-role="queue-home-copy">사전 접수 시작 전이에요. 설정된 시간에 자동으로 접수가 열립니다.</span></p>
                <div class="queue-home-actions">
                  <button type="button" class="solid-action" data-queue-home-route="management">특전회 대기</button>
                  <button type="button" class="line-action" data-queue-home-route="overview">대기 현황 보기</button>
                </div>
              </div>
              <div class="queue-number-card" aria-label="현재 상태"><span>현재 상태</span><strong data-role="queue-home-status">준비 중</strong></div>
            </article>

            <section class="app-section-block" aria-label="주요 앱">
              <div class="section-title-row"><strong>주요 앱</strong><span>현장에서 자주 쓰는 기능</span></div>
              <div class="app-grid app-grid-main" data-role="app-grid-main"></div>
            </section>
          </section>

          <section class="screen-page home-page home-more-page" data-page="home-more" aria-label="Staff Office">
            <header class="home-header compact-header">
              <div>
                <span class="home-kicker">STAFF OFFICE</span>
                <strong>운영 보조</strong>
              </div>
            </header>
            <section class="app-section-block" aria-label="보조 앱">
              <div class="section-title-row"><strong>다른 기능</strong><span>운영 보조</span></div>
              <div class="app-grid app-grid-more" data-role="app-grid-more"></div>
            </section>
          </section>
        </div>

        <div class="page-dots" data-role="page-dots" aria-hidden="true"></div>

        <nav class="home-dock" data-role="dock" aria-label="quick apps">
          <button type="button" data-dock-app="queue" class="dock-primary"><span>대기</span><em>특전회</em></button>
          <button type="button" data-dock-app="gate"><span>입장</span><em>입장</em></button>
          <button type="button" data-action="home"><span>홈</span><em>홈</em></button>
          <button type="button" data-dock-app="booth"><span>물판</span><em>물판</em></button>
          <button type="button" data-dock-app="profile"><span>MY</span><em>MY</em></button>
        </nav>

        <section class="app-window" data-role="app-window" aria-label="app window" aria-hidden="true">
          <header class="app-header"><strong data-role="app-title"></strong></header>
          <div class="app-body" data-role="app-body"></div>
          <section class="app-overview" data-role="app-overview" aria-label="최근 실행 앱" aria-hidden="true">
            <div class="app-overview-track" data-role="app-overview-track" aria-label="최근 실행 앱 카드"></div>
            <button type="button" class="app-overview-close-all" data-action="close-all-recent">모두 닫기</button>
          </section>
          <nav class="system-nav" aria-label="app navigation">
            <button type="button" data-action="recent"><span>□</span><em data-i18n="nav.tabs">탭보기</em></button>
            <button type="button" data-action="home"><span>○</span><em data-i18n="nav.home">홈</em></button>
            <button type="button" data-action="back"><span>←</span><em data-i18n="nav.back">뒤로가기</em></button>
          </nav>
        </section>
      </div>
    </section>
  </main>
  <script src="js/i18n.js"></script>
  <script src="js/staff-os.js"></script>
  <script src="js/apps/placeholder-apps.js"></script>
  <script src="js/apps/booth.js"></script>
  <script src="js/apps/memo.js"></script>
  <script src="js/apps/gate.js"></script>
  <script src="js/apps/point.js"></script>
  <script src="js/apps/point-adjust.js"></script>
  <script src="js/apps/caution.js"></script>
  <script src="js/apps/cheki.js"></script>
  <script src="js/apps/timer.js"></script>
  <script src="js/apps/fan-check.js"></script>
  <script src="js/apps/queue.js"></script>
  <script src="js/apps/attendance.js"></script>
  <script src="js/apps/homework-cheki.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function () { StaffOS.init(); });</script>
</body>
</html>
