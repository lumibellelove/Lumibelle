<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LUMI PHONE V2</title>
  <link rel="stylesheet" href="css/lumiphone.css" />
  <link rel="stylesheet" href="css/apps/placeholder-apps.css" />
  <link rel="stylesheet" href="css/apps/ticket.css" />
  <link rel="stylesheet" href="css/apps/messages.css" />
  <link rel="stylesheet" href="css/apps/mail.css" />
  <link rel="stylesheet" href="css/apps/booth-bank.css" />
  <link rel="stylesheet" href="css/apps/point.css" />
  <link rel="stylesheet" href="css/apps/stamp.css" />
  <link rel="stylesheet" href="css/apps/homework-cheki.css" />
  <link rel="stylesheet" href="css/apps/cheerbook.css" />
  <link rel="stylesheet" href="css/apps/attendance.css" />
  <link rel="stylesheet" href="css/apps/timeline.css" />
  <link rel="stylesheet" href="css/apps/achievement.css" />
  <link rel="stylesheet" href="css/apps/benefit-queue.css" />
  <link rel="stylesheet" href="css/apps/notification.css" />
  <link rel="stylesheet" href="css/apps/profile.css" />
  <link rel="stylesheet" href="css/apps/settings.css" />
  <link rel="stylesheet" href="css/apps/lumitalk.css" />
  <link rel="stylesheet" href="css/apps/lumilog.css" />
</head>
<body>
  <main class="phone-stage">
    <section class="phone-shell" aria-label="LUMI PHONE V2">
      <div class="phone-screen">
        <div class="screens" data-role="screens">
          <section class="screen-page home-page" data-page="home-main" aria-label="Home">
            <header class="home-header">
              <div>
                <span class="home-kicker">LUMI PHONE</span>
                <strong>LumiPhone V2</strong>
              </div>
              <div class="home-header-actions">
                <button type="button" data-dock-app="profile" aria-label="프로필">MY</button>
                <button type="button" class="home-notification-button" data-dock-app="notification" aria-label="알림센터"><span aria-hidden="true">알림</span><b data-notification-badge>2</b></button>
              </div>
            </header>

            <button type="button" class="today-event-card" data-dock-app="ticket" aria-label="오늘 공연 보기">
              <div class="event-poster-slot" aria-hidden="true"><span>LIVE</span></div>
              <div class="event-copy">
                <span class="event-chip" data-role="dday-label">D-DAY</span>
                <strong data-role="reservation-title">루미벨 데뷔 라이브</strong>
                <p data-role="reservation-date">2026.07.12 (일) 오후 6:00</p>
                <p data-role="reservation-meta">홍대 상상마당 라이브홀</p>
                <p class="event-weather" data-role="weather-desc">공연장 날씨 · 24°C 맑음</p>
              </div>
            </button>

            <section class="summary-grid" data-role="today-summary" aria-label="내 현황"></section>

            <article class="queue-home-card">
              <div class="queue-home-content">
                <div class="queue-card-head">
                  <strong>특전회 대기</strong>
                </div>
                <p><b>현재 접수 중이에요!</b><span>지금 신청하면 자동으로 대기 번호가 부여돼요.</span></p>
                <div class="queue-home-actions">
                  <button type="button" class="solid-action" data-dock-app="benefitQueue">접수하기</button>
                  <button type="button" class="line-action" data-dock-app="benefitQueue">내 대기 보기</button>
                </div>
              </div>
              <div class="queue-number-card" aria-label="내 대기 번호"><span>내 대기 번호</span><strong>23번</strong></div>
            </article>

            <section class="app-section-block" aria-label="주요 앱">
              <div class="section-title-row"><strong>주요 앱</strong><span>자주 쓰는 기능</span></div>
              <div class="app-grid app-grid-main" data-role="app-grid-main"></div>
            </section>
          </section>

          <section class="screen-page home-page home-more-page" data-page="home-more" aria-label="More Apps">
            <header class="home-header compact-header">
              <div>
                <span class="home-kicker">MORE</span>
                <strong>더보기</strong>
              </div>
            </header>
            <section class="app-section-block" aria-label="보조 앱">
              <div class="section-title-row"><strong>다른 기능</strong><span>천천히 준비 중이에요</span></div>
              <div class="app-grid app-grid-more" data-role="app-grid-more"></div>
            </section>
          </section>
        </div>

        <div class="page-dots" data-role="page-dots" aria-hidden="true"></div>

        <nav class="home-dock" data-role="dock" aria-label="quick apps">
          <button type="button" data-action="home"><span>홈</span><em>홈</em></button>
          <button type="button" data-dock-app="ticket"><span>티켓</span><em>티켓</em></button>
          <button type="button" data-dock-app="benefitQueue" class="dock-primary"><span>대기</span><em>특전회</em></button>
          <button type="button" data-dock-app="boothBank"><span>통장</span><em>물판</em></button>
          <button type="button" data-dock-app="profile"><span>MY</span><em>마이</em></button>
        </nav>

        <section class="app-window" data-role="app-window" aria-label="app window" aria-hidden="true">
          <header class="app-header"><strong data-role="app-title"></strong></header>
          <div class="app-body" data-role="app-body"></div>
          <section class="app-overview" data-role="app-overview" aria-label="최근 실행 앱" aria-hidden="true">
            <div class="app-overview-track" data-role="app-overview-track" aria-label="최근 실행 앱 카드"></div>
            <button type="button" class="app-overview-close-all" data-action="close-all-recent">모두 닫기</button>
          </section>
          <nav class="system-nav" aria-label="app navigation">
            <button type="button" data-action="recent"><span>□</span><em data-i18n="nav.tabs">탭보기</em></button>
            <button type="button" data-action="home"><span>○</span><em data-i18n="nav.home">홈</em></button>
            <button type="button" data-action="back"><span>←</span><em data-i18n="nav.back">뒤로가기</em></button>
          </nav>
        </section>
      </div>
    </section>
  </main>
  <script src="js/i18n.js"></script>
  <script src="js/lumiphone.js"></script>
  <script src="js/apps/placeholder-apps.js"></script>
  <script src="js/apps/ticket.js"></script>
  <script src="js/apps/messages.js"></script>
  <script src="js/apps/mail.js"></script>
  <script src="js/apps/booth-bank.js"></script>
  <script src="js/apps/point.js"></script>
  <script src="js/apps/stamp.js"></script>
  <script src="js/apps/homework-cheki.js"></script>
  <script src="js/apps/cheerbook.js"></script>
  <script src="js/apps/attendance.js"></script>
  <script src="js/apps/timeline.js"></script>
  <script src="js/apps/achievement.js"></script>
  <script src="js/apps/benefit-queue.js"></script>
  <script src="js/apps/notification.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="js/apps/profile.js"></script>
  <script src="js/apps/settings.js"></script>
  <script src="js/apps/lumitalk.js"></script>
  <script src="js/apps/lumilog.js"></script>
  <script>
    window.LumiPhone.init();
  </script>
</body>
</html>
