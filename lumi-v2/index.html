<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LUMI PHONE</title>
  <link rel="stylesheet" href="css/lumiphone.css" />
  <link rel="stylesheet" href="css/apps/placeholder-apps.css" />
  <link rel="stylesheet" href="css/apps/ticket.css" />
</head>
<body>
  <main class="phone-stage">
    <section class="phone-shell" aria-label="LUMI PHONE">
      <div class="phone-screen">
        <div class="camera-dot" aria-hidden="true"></div>

        <header class="status-bar" aria-label="status">
          <span data-role="status-time">12:34</span>
          <span>✦ LUMI 100%</span>
        </header>
<div class="screens" data-role="screens">
<section class="screen-page today-page" data-page="today" aria-label="Today View">
            <div class="top-widget-grid">
              <article class="card weather-card">
                <span data-i18n="today.weather">LUMI WEATHER</span>
                <strong data-role="weather-temp">21°C</strong>
                <p data-role="weather-desc">공연장 날씨 또는 현재 위치 기준으로 표시돼요.</p>
              </article>

              <article class="card clock-card">
                <div>
                  <strong data-role="clock-time">12:34</strong>
                  <span data-role="clock-date">FRI · MAY</span>
                </div>
              </article>
            </div>

            <div class="reservation-row">
              <article class="card reservation-card">
                <span data-i18n="today.reservation">현재 예약</span>
                <strong data-role="reservation-title"></strong>
                <p data-role="reservation-meta"></p>
                <em data-role="reservation-status"></em>
              </article>

              <article class="card dday-card">
                <span data-role="dday-label">D-DAY</span>
                <strong data-role="dday-value">27</strong>
                <span data-role="dday-unit">LIVE LIFE</span>
              </article>
            </div>
<div class="mini-info-grid" data-role="today-summary" aria-label="summary"></div>

            <article class="card message-card">
              <div class="message-copy">
                <strong data-i18n="today.message">오늘의 한마디</strong>
                <p data-role="today-message">오늘도 루미벨과 연결되어 있어요.<br>반짝이는 마음은 오래 보관돼요.</p>
              </div>
              <div class="message-orb" aria-hidden="true">✦</div>
            </article>

            <article class="card onair-card">
              <div>
                <strong data-i18n="today.onair">ON AIR 현황</strong>
                <span data-role="onair-status">다음 방송 알림 대기 중</span>
              </div>
              <em data-role="onair-badge">STANDBY</em>
            </article>
          </section>
<section class="screen-page home-page" data-page="home-main" aria-label="Home">
            <article class="card home-widget stamp-widget" aria-label="LUMI STAMP">
              <div class="home-widget-copy">
                <span data-i18n="home.stamp.label">LUMI STAMP</span>
                <strong><em data-role="home-stamp-current">3</em><small>/ 20</small></strong>
                <p data-i18n="home.stamp.desc">스탬프를 모아보세요</p>
              </div>
              <div class="stamp-preview" aria-hidden="true">
                <i class="is-filled">✿</i><i class="is-filled">✿</i><i class="is-filled">✿</i><i></i><i></i><i></i>
              </div>
            </article>
            <div class="app-grid" data-role="app-grid-main"></div>
          </section>
<section class="screen-page home-page" data-page="home-more" aria-label="More Apps">
            <article class="card home-widget energy-widget" aria-label="반짝 충전">
              <div class="home-widget-copy">
                <span data-i18n="home.energy.label">반짝 충전</span>
                <strong><em data-role="home-energy-value">67</em><small>%</small></strong>
                <p data-i18n="home.energy.desc">오늘의 루미 에너지가 채워지고 있어요.</p>
              </div>
              <div class="energy-meter" aria-hidden="true">
                <b>♡</b>
                <i><span style="width:67%"></span></i>
              </div>
            </article>
            <div class="app-grid" data-role="app-grid-more"></div>
          </section>

        </div>

<div class="page-dots" data-role="page-dots" aria-hidden="true"></div>
<nav class="home-dock" data-role="dock" aria-label="quick apps">
          <button type="button" data-dock-app="ticket">
            <span>🎟</span><em data-i18n="app.ticket">티켓</em>
          </button>
          <button type="button" data-dock-app="messages">
            <span>💬</span><em data-i18n="app.messages">문자</em>
          </button>
<button type="button" class="dock-home-btn" data-action="home">
            <span>⌂</span><em data-i18n="nav.home">홈</em>
          </button>
          <button type="button" data-dock-app="lumitalk">
            <span>♡</span><em data-i18n="app.lumitalk">루미톡</em>
          </button>
          <button type="button" data-dock-app="profile">
            <span>👤</span><em data-i18n="app.profile">프로필</em>
          </button>
        </nav>
<section class="app-window" data-role="app-window" aria-label="app window" aria-hidden="true">
          <header class="app-header">
            <strong data-role="app-title"></strong>
          </header>
          <div class="app-body" data-role="app-body"></div>
<section class="recent-panel" data-role="recent-panel" aria-hidden="true">
            <header>
              <strong data-i18n="recent.title">최근 앱</strong>
              <button type="button" data-action="close-recent" data-i18n="common.close">닫기</button>
            </header>
            <div class="recent-list" data-role="recent-list"></div>
          </section>

          <nav class="system-nav" aria-label="app navigation">
            <button type="button" data-action="recent">
              <span>□</span><em data-i18n="nav.tabs">탭보기</em>
            </button>
            <button type="button" data-action="home">
              <span>○</span><em data-i18n="nav.home">홈</em>
            </button>
            <button type="button" data-action="back">
              <span>←</span><em data-i18n="nav.back">뒤로가기</em>
            </button>
          </nav>
        </section>

      </div>
</section>
  </main>
<script src="js/i18n.js"></script>
  <script src="js/lumiphone.js"></script>
  <script src="js/apps/placeholder-apps.js"></script>
  <script src="js/apps/ticket.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
      LumiPhone.init();
    });
  </script>
</body>
</html>
